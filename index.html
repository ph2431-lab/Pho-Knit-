    const ovOpen = store.get('kmOv', false);
    const overview = c.kind === 'rows' && rt.length > 1 ? `<details class="km-ov" id="kmOverview" ${ovOpen ? 'open' : ''}><summary><span>☰ ${c.rep ? 'Repeat overview' : 'Row-by-row'}</span><span class="pill">${rt.length} rows</span></summary>
        <ol>${rt.map((l, i) => { const sp = splitSide(l); const cur = i === (c.rowInRep - 1) % rt.length; return `<li class="${cur ? 'cur' : ''}">${sp.side ? `<span class="side-tag">${sp.side}</span> ` : ''}${glossHtml(sp.text)}</li>`; }).join('')}</ol></details>` : '';
    const nx = c.secs[c.idx + 1];
    const pg = partsOf(c.secs).find(g => g.steps.includes(s)), pnt = (p.pieceNotes || {})[pieceKey(s)] || {};
    const startNote = pnt.start && pg && pg.steps[0] === s ? `<div class="sb-note start km-note">${IC.play}<span><b>Before you start:</b> ${glossHtml(pnt.start)}</span></div>` : '';
    const endNote = pnt.end && pg && pg.steps[pg.steps.length - 1] === s ? `<div class="sb-note end km-note">${IC.flag}<span><b>When you finish:</b> ${glossHtml(pnt.end)}</span></div>` : '';
    left.innerHTML = `${startNote}${counters}
      <div class="km-card"><div class="km-ins ${ins.length > 180 ? 'sm' : ''}">${glossHtml(ins)}</div>
        ${c.kind === 'rows' && rt.length && s.note ? `<p class="muted" style="margin:0;font-size:.92rem">${glossHtml(s.note)}</p>` : ''}</div>
      ${nowR.length || nxt ? `<div class="rem">${nowR.map(h => `<div class="rem-now">${ICON_FLAG}<span>This row: ${esc(h.text)}</span></div>`).join('')}
        ${nxt ? `<div class="rem-next" style="text-align:center">Coming up: <b>${esc(nxt.hits.map(h => h.text).join(' · '))}</b> on row ${nxt.row} (in ${nxt.row - c.r})</div>` : ''}</div>` : ''}
      ${(p.charts || []).filter(ch => ch.link === s.id).map(ch => { const pos = chartPos(p, ch); return `<a class="km-chart" href="#chart-${esc(id)}-${esc(ch.id)}"><span class="km-chart-h"><b>${esc(ch.name)}</b><span>${esc(chartWhere(ch, pos))}</span><span class="link-btn">Open chart ›</span></span>${chartHtml(ch, pos, { focus: ch.focus })}</a>`; }).join('')}
      ${overview}
      ${c.kind === 'stitches' ? `<div class="tracker"><span class="tt">${esc(/pick/i.test(s.name || '') ? 'Pick-up' : 'Cast-on')} tracker</span><div class="big">${c.n}</div><div class="of">${s.target ? `of ${s.target} stitches` : 'stitches'}</div>
        <div class="tgrid"><button data-st="1">+1</button><button data-st="5">+5</button><button data-st="10">+10</button><button class="neg" data-st="-1">−1</button><button class="neg" data-st="-5">−5</button><button class="neg" data-st="-10">−10</button></div>
        <button class="link-btn" id="kmStReset" style="color:var(--muted)">Reset</button></div>` : ''}
      ${c.kind === 'rows' && !c.tot ? `<button class="btn" id="kmFinish">Piece is long enough: finish step</button>` : ''}
      ${endNote}
      ${nx ? `<p class="km-up">Up next: ${esc(nx.name)}${nx.part && nx.part !== s.part ? ' · ' + esc(nx.part) : ''}</p>` : ''}`;
  }
  draw();
  const tick = setInterval(() => {
    const p = getP(); if (!p) return;
    if (p.timerStart) { const tb = $('#kmTimer', el); if (tb) tb.innerHTML = `❚❚ Pause · ${fmtDur(elapsed(p))}`; }
    const t = $('#kmTap', el); if (t) t.textContent = tapText(p);
  }, 1000);
  return {
    update: draw,
    destroy() {
      clearInterval(tick);
      viewer?.destroy();
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('visibilitychange', wake);
      try { lock?.release(); } catch {}
    }
  };
}

/* ---------- charts ----------
   A chart is a grid: `cells[i]` is row i counted from the bottom (row `startNum`), one character per stitch from left to right.
   It can also carry a traced image cropped from the PDF, shown behind the grid while editing, or on its own when nothing is drawn.
   A chart keeps its own row and repeat count, or follows a rows step so Next row on the knitting screen moves it too. */
const SYM = {
  ' ': { n: 'Knit', rs: 'k', ws: 'p', g: '' },
  '.': { n: 'Purl', rs: 'p', ws: 'k', g: '•' },
  'o': { n: 'Yarn over', rs: 'yo', ws: 'yo', g: '○' },
  '/': { n: 'K2tog', rs: 'k2tog', ws: 'p2tog', g: '╱' },
  '\\': { n: 'SSK', rs: 'ssk', ws: 'ssp', g: '╲' },
  '^': { n: 'Centered double decrease', rs: 'cdd', ws: 'cdd', g: 'Λ' },
  'L': { n: 'Make 1 left', rs: 'M1L', ws: 'M1Lp', g: 'ML' },
  'R': { n: 'Make 1 right', rs: 'M1R', ws: 'M1Rp', g: 'MR' },
  'v': { n: 'Slip 1', rs: 'sl1', ws: 'sl1', g: 'V' },
  'b': { n: 'Knit through back loop', rs: 'k1 tbl', ws: 'p1 tbl', g: 'tb' },
  'F': { n: 'Cable, front cross', rs: 'CF', ws: 'CF', g: 'CF' },
  'B': { n: 'Cable, back cross', rs: 'CB', ws: 'CB', g: 'CB' },
  'x': { n: 'No stitch', rs: '', ws: '', g: '' }
};
const DEF_COLORS = ['#2B2B2B', '#C0392B', '#F1C40F', '#2E86C1', '#27AE60', '#8E44AD'];
const LETTER = 'ABCDEF';
function symInfo(ch, c) {
  if (/[1-6]/.test(c)) { const k = +c - 1; return { n: 'Color ' + LETTER[k], rs: LETTER[k], ws: LETTER[k], fill: (ch.colors || DEF_COLORS)[k] }; }
  return SYM[c] || SYM[' '];
}
const blankCells = (rows, cols) => Array.from({ length: rows }, () => ' '.repeat(cols));
const hasCells = ch => Array.isArray(ch.cells) && ch.cells.some(r => /[^ ]/.test(r));
const otherSide = s => (s === 'RS' ? 'WS' : 'RS');
const chartSide = (ch, num) => (!ch.oddSide ? null : Math.abs(num) % 2 === 1 ? ch.oddSide : otherSide(ch.oddSide));

function drawGrid(ctx, ch, { cell, x0 = 0, y0 = 0, bg = null, bgAlpha = 1, labels = false, sel = null }) {
  const R = ch.rows, C = ch.cols, cells = ch.cells || blankCells(R, C);
  const W = C * cell, H = R * cell;
  ctx.fillStyle = '#fff'; ctx.fillRect(x0, y0, W, H);
  if (bg) { ctx.globalAlpha = bgAlpha; ctx.drawImage(bg, x0, y0, W, H); ctx.globalAlpha = 1; }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let v = 0; v < R; v++) {
    const row = cells[R - 1 - v] || '';
    for (let c = 0; c < C; c++) {
      const ch1 = row[c] || ' ', x = x0 + c * cell, y = y0 + v * cell;
      if (ch1 === ' ') continue;
      const s = symInfo(ch, ch1);
      if (s.fill) { ctx.fillStyle = s.fill; ctx.fillRect(x, y, cell, cell); continue; }
      if (ch1 === 'x') { ctx.fillStyle = '#C9C6CC'; ctx.fillRect(x, y, cell, cell); continue; }
      if (bg) { ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(x, y, cell, cell); }
      ctx.fillStyle = '#1F1A24';
      ctx.font = `700 ${Math.round(cell * (s.g.length > 1 ? 0.42 : 0.62))}px system-ui, sans-serif`;
      ctx.fillText(s.g, x + cell / 2, y + cell / 2 + 1);
    }
  }
  ctx.lineWidth = 1;
  for (let c = 0; c <= C; c++) { ctx.strokeStyle = c % 10 === 0 ? '#8A8590' : '#C8C4CC'; ctx.beginPath(); ctx.moveTo(x0 + c * cell + .5, y0); ctx.lineTo(x0 + c * cell + .5, y0 + H); ctx.stroke(); }
  for (let v = 0; v <= R; v++) { const i = R - v; ctx.strokeStyle = i % 10 === 0 ? '#8A8590' : '#C8C4CC'; ctx.beginPath(); ctx.moveTo(x0, y0 + v * cell + .5); ctx.lineTo(x0 + W, y0 + v * cell + .5); ctx.stroke(); }
  ctx.strokeStyle = '#1F1A24'; ctx.lineWidth = 2; ctx.strokeRect(x0 + 1, y0 + 1, W - 2, H - 2);
  if (sel) { ctx.strokeStyle = '#0A84FF'; ctx.lineWidth = 3; ctx.setLineDash([6, 4]); ctx.strokeRect(x0 + sel.c0 * cell, y0 + sel.v0 * cell, (sel.c1 - sel.c0 + 1) * cell, (sel.v1 - sel.v0 + 1) * cell); ctx.setLineDash([]); }
  if (labels) {
    ctx.fillStyle = '#8E2C5C'; ctx.font = `600 ${Math.max(10, Math.min(14, cell * 0.5))}px system-ui, sans-serif`;
    const stepR = cell < 14 ? 5 : 1;
    for (let v = 0; v < R; v++) { const num = (ch.startNum || 1) + R - 1 - v; if (num % stepR === 0 || stepR === 1) ctx.fillText(String(num), x0 + W + 17, y0 + v * cell + cell / 2); }
    for (let c = 0; c < C; c++) { const num = C - c; if (num % stepR === 0 || stepR === 1) ctx.fillText(String(num), x0 + c * cell + cell / 2, y0 + H + 13); }
  }
}
const chartSrcCache = new Map();
function chartSrc(ch) {
  if (!hasCells(ch) && ch.img) return blobUrl(ch.img);
  const key = ch.id + '|' + ch.rows + 'x' + ch.cols + '|' + (ch.cells || []).join('/') + '|' + (ch.colors || []).join();
  if (!chartSrcCache.has(key)) {
    const cell = Math.max(8, Math.min(28, Math.floor(3600 / Math.max(ch.cols, ch.rows))));
    const c = document.createElement('canvas'); c.width = ch.cols * cell; c.height = ch.rows * cell;
    drawGrid(c.getContext('2d'), ch, { cell });
    chartSrcCache.set(key, c.toDataURL('image/png'));
  }
  return chartSrcCache.get(key);
}

const stitchTotal = ch => (ch.cols || 0) * (ch.perRow || 1);
function chartPos(p, ch) {
  const rows = Math.max(1, ch.rows || 1);
  let i = ch.cur || 0, rep = ch.rep || 1, linked = null;
  const s = ch.link && (p.sections || []).find(x => x.id === ch.link);
  if (s && kindOf(s) === 'rows') {
    const n = cnt(p, s), t = secTotal(s);
    const r = t != null && n >= t ? t : n + 1;
    i = (r - 1) % rows; rep = Math.floor((r - 1) / rows) + 1; linked = s;
  }
  i = Math.max(0, Math.min(i, rows - 1));
  const num = (ch.startNum || 1) + i, side = chartSide(ch, num);
  const done = new Set(linked ? Array.from({ length: i }, (_, k) => k) : (ch.done || []).filter(k => k < rows));
  return { rows, i, rep, num, side, rtl: side !== 'WS', linked, done, st: Math.min(ch.st || 0, stitchTotal(ch)) };
}
/* the row written out, read in knitting order: right to left on RS rows and rounds, left to right on WS rows */
function rowWords(ch, i, side) {
  const row = ch.cells?.[i]; if (!row || !hasCells(ch)) return '';
  const seq = [...row]; if (side !== 'WS') seq.reverse();
  const toks = seq.filter(c => c !== 'x').map(c => (side === 'WS' ? symInfo(ch, c).ws : symInfo(ch, c).rs));
  const out = [];
  for (let k = 0; k < toks.length;) { let n = 1; while (toks[k + n] === toks[k]) n++; const t = toks[k]; out.push(/^[kpA-F]$/.test(t) ? t + n : n > 1 ? `${t} ×${n}` : t); k += n; }
  const w = out.join(', ');

}
function stitchAt(ch, pos) {
  if (!ch.cols) return null;
  const k = pos.st % ch.cols, col = pos.rtl ? ch.cols - 1 - k : k;
  return { col, sym: hasCells(ch) ? symInfo(ch, (ch.cells[pos.i] || '')[col] || ' ') : null };
}
function chartHtml(ch, pos, { focus = false, interactive = false, labels = true } = {}) {
  const R = pos.rows, band = k => `top:${(1 - (k + 1) / R) * 100}%;height:${100 / R}%`;
  let ov = '';
  if (focus && pos.i < R - 1) ov += `<div class="ch-hide" style="top:0;height:${(1 - (pos.i + 1) / R) * 100}%"></div>`;
  pos.done.forEach(k => { if (k !== pos.i) ov += `<div class="ch-done" style="${band(k)}"></div>`; });
  ov += `<div class="ch-cur" style="${band(pos.i)}"></div>`;
  if (ch.cols && ch.stitchMode) { const sa = stitchAt(ch, pos); ov += `<div class="ch-st" style="${band(pos.i)};left:${(sa.col / ch.cols) * 100}%;width:${100 / ch.cols}%"></div>`; }
  if (interactive) for (let k = 0; k < R; k++) ov += `<button class="ch-hit" data-row="${k}" style="${band(k)}" aria-label="Go to row ${(ch.startNum || 1) + k}"></button>`;
  const showL = labels && R <= 80;
  const rl = showL ? `<div class="ch-rl">${Array.from({ length: R }, (_, v) => { const k = R - 1 - v, n = (ch.startNum || 1) + k; return `<span class="${k === pos.i ? 'on' : ''}">${R > 30 && n % 5 && k !== pos.i ? '' : n}</span>`; }).join('')}</div>` : '';
  const cl = showL && ch.cols && ch.cols <= 80 && hasCells(ch) ? `<div class="ch-cl">${Array.from({ length: ch.cols }, (_, c) => { const n = ch.cols - c; return `<span>${ch.cols > 30 && n % 5 ? '' : n}</span>`; }).join('')}</div>` : '';
  return `<div class="chart2 ${showL ? 'lab' : ''}"><div class="ch-area"><img src="${chartSrc(ch)}" alt="${esc(ch.name || 'Chart')}" draggable="false"><div class="ch-ov">${ov}</div></div>${rl}${cl}</div>`;
}
const chartWhere = (ch, pos) => `Row ${pos.num}${pos.side ? ' · ' + pos.side : ''} · ${pos.i + 1} of ${pos.rows}${pos.rep > 1 || ch.repTotal ? ` · repeat ${pos.rep}${ch.repTotal ? '/' + ch.repTotal : ''}` : ''}`;

function chartAct(pid, cid) {
  const P = () => S.projects.get(pid);
  const get = () => (P().charts || []).find(c => c.id === cid);
  const put = patch => { const p = P(); save('projects/' + pid, { charts: (p.charts || []).map(c => (c.id === cid ? { ...c, ...patch } : c)), updatedAt: Date.now() }); };
  const tap = () => {
    const p = P(), patch = { lastTap: Date.now() };
    if (!p.timerStart) { patch.timerStart = Date.now(); toast('Timer started. Tap Pause to stop it.', '', 2200); }
    if (p.status === 'planned') patch.status = 'active';
    save('projects/' + pid, patch);
  };
  const linkedCount = (pos, k, rep) => { const p = P(), s = pos.linked; save('projects/' + pid, { counts: { ...(p.counts || {}), [s.id]: Math.min(secTotal(s) ?? 1e9, (rep - 1) * pos.rows + k) }, done: { ...(p.done || {}), [s.id]: false }, cur: s.id }); };
  return {
    next() {
      const ch = get(), p = P(), pos = chartPos(p, ch);
      if (pos.linked) { const A = projActions(pid); if (cState(p).s?.id !== pos.linked.id) A.jump(pos.linked.id); A.next(); put({ st: 0 }); return; }
      tap();
      const done = [...new Set([...(ch.done || []), pos.i])];
      if (pos.i + 1 < pos.rows) put({ cur: pos.i + 1, done, st: 0 });
      else if (ch.repTotal && pos.rep >= ch.repTotal) { put({ done, st: 0 }); toast('Last row of the last repeat done.'); }
      else { put({ cur: 0, rep: pos.rep + 1, done: [], st: 0 }); toast(`Repeat ${pos.rep} done. Starting repeat ${pos.rep + 1}.`, '', 3500); }
    },
    undo() {
      const ch = get(), p = P(), pos = chartPos(p, ch);
      if (pos.linked) { const A = projActions(pid); if (cState(p).s?.id !== pos.linked.id) A.jump(pos.linked.id); A.undo(); put({ st: 0 }); return; }
      if (pos.i > 0) put({ cur: pos.i - 1, done: (ch.done || []).filter(k => k !== pos.i - 1 && k !== pos.i), st: 0 });
      else if (pos.rep > 1) put({ cur: pos.rows - 1, rep: pos.rep - 1, done: Array.from({ length: pos.rows - 1 }, (_, k) => k), st: 0 });
    },
    go(k) { const ch = get(), pos = chartPos(P(), ch); if (pos.linked) linkedCount(pos, k, pos.rep); else put({ cur: k, st: 0 }); },
    toggle(k) {
      const ch = get(), pos = chartPos(P(), ch);
      if (pos.linked) return toast('This chart follows its step’s row counter. Tap a row to move there.');
      const d = new Set(ch.done || []); d.has(k) ? d.delete(k) : d.add(k); put({ done: [...d] });
    },
    stitch(d) { const ch = get(); if (!ch.cols) return; tap(); put({ st: Math.max(0, Math.min(stitchTotal(ch), (ch.st || 0) + d)) }); },
    set: put
  };
}

/* the chart tracker screen */
function mountChart(el, pid, cid) {

    el.innerHTML = `<section class="wrap page"><a href="#project-${esc(pid)}" class="crumbs">← Project</a><p class="muted">${S.loaded.projects ? 'This chart was deleted or the link is wrong.' : 'Loading…'}</p></section>`;
    return { update: () => { if (getC()) route(); } };
  }
  document.body.classList.add('in-knit');
  const C = chartAct(pid, cid);
  let zoom = store.get('chzoom', 1);
  el.innerHTML = `<section>
    <div class="km-top"><div class="wrap km-top-in">
      <a class="icon-btn" href="#project-${esc(pid)}" aria-label="Back to project">‹</a>
      <h1 id="chName"></h1>
      <a class="btn small" id="chSet" href="#chartedit-${esc(pid)}-${esc(cid)}">Edit</a></div></div>
    <div class="wrap ch-head"><span class="km-part" id="chProj"></span><div class="ch-pos" id="chPos"></div><div class="ch-words" id="chWords"></div>
      <div class="ch-tools"><div class="vgroup" role="group" aria-label="Zoom"><button class="icon-btn" data-z="-1" aria-label="Zoom out">−</button><button class="icon-btn" data-z="0" id="chZl"></button><button class="icon-btn" data-z="1" aria-label="Zoom in">+</button></div>
        <button class="btn small" id="chFocus"></button><button class="btn small" id="chStM"></button></div></div>
    <div class="wrap ch-main"><div class="ch-scroll" id="chScroll"><div class="ch-zoom" id="chZoom"></div></div>
      <aside class="ch-list panel"><h3>Rows</h3><p class="muted" id="chListNote" style="margin:0;font-size:.85rem"></p><div id="chRows"></div>${getC().notes ? `<p class="ch-notes">${esc(getC().notes)}</p>` : ''}</aside></div>

  function reviewSheet() {

      <div class="rv-list">${items.map((it, i) => `<div class="rv"><span class="rv-where">${esc(label(it))}</span><p>${esc(it.msg)}</p><div class="rv-b">${it.sid ? `<button class="btn small" data-rv-edit="${esc(it.sid)}">Edit</button>` : it.size ? '<button class="btn small" data-rv-size>Choose size</button>' : ''}<button class="btn small ghost" data-rv-ok="${i}">Looks right</button></div></div>`).join('') || '<p class="muted">Nothing left to review.</p>'}</div>`, { wide: true });

      else if (it.size) { save('projects/' + id, { size: '—' }); render(); }
      m.close(); if (reviewItems(getP(), getPat()).length) reviewSheet();
    });
  }

  /* ----- the tree ----- */
  function blockCard(p, s) {

  function render() {

            return sg.name ? `<div class="sb-sec"><div class="sb-card section" data-secid="${esc(sg.steps[0].id)}" role="button" tabindex="0"><span class="sb-ic">${IC.grip}</span>
                <div class="sb-main"><b>${esc(sg.name)}</b><small>${sg.steps.length} block${sg.steps.length > 1 ? 's' : ''}</small></div>

        </div>` : ''}</div>`;

  /* ----- taps ----- */
  $b('#sbTree').addEventListener('click', async e => {
    if (dragged) return;

  $b('#sbAddPiece').onclick = async () => {

  /* ----- piece, section and block menus ----- */
  const groupOf = (secs, sid, by) => { const s = secs.find(x => x.id === sid); return s ? secs.filter(x => pieceKey(x) === pieceKey(s) && (by === 'piece' || (x.section || '') === (s.section || ''))) : []; };
  function moveGroup(secs, ids, dir, by) {
    const first = secs.findIndex(x => x.id === ids[0]), last = first + ids.length - 1;
    const sameUnit = x => (by === 'piece' ? pieceKey(x) : pieceKey(x) + '|' + (x.section || ''));
    if (dir < 0) {
      if (first === 0) return secs;
      const nb = sameUnit(secs[first - 1]); let st = first - 1;
      while (st > 0 && sameUnit(secs[st - 1]) === nb && (by === 'piece' || pieceKey(secs[st - 1]) === pieceKey(secs[first]))) st--;
      if (by === 'section' && pieceKey(secs[first - 1]) !== pieceKey(secs[first])) return secs;
      return [...secs.slice(0, st), ...secs.slice(first, last + 1), ...secs.slice(st, first), ...secs.slice(last + 1)];
    }
    if (last === secs.length - 1) return secs;
    if (by === 'section' && pieceKey(secs[last + 1]) !== pieceKey(secs[first])) return secs;
    const nb = sameUnit(secs[last + 1]); let en = last + 1;
    while (en < secs.length - 1 && sameUnit(secs[en + 1]) === nb) en++;
    return [...secs.slice(0, first), ...secs.slice(last + 1, en + 1), ...secs.slice(first, last + 1), ...secs.slice(en + 1)];
  }
  async function pieceMenu(sid) {
    const secs = secsNow(), grp = groupOf(secs, sid, 'piece'); if (!grp.length) return;
    const name = (grp[0].part || '').trim() || 'Pattern', key = pieceKey(grp[0]);
    const a = await menu(name, [['rename', 'Rename piece'], ['notes', 'Start and finish notes'], ['addsec', 'Add section'], ['dup', 'Duplicate piece (e.g. for the other sleeve)'], ['up', 'Move piece up'], ['down', 'Move piece down'], ['del', 'Delete piece', 'danger']]);
    if (a === 'rename') {
      const v = await askText('Rename piece', 'Piece name', name); if (!v || v === name) return;
      const notes = { ...(getP().pieceNotes || {}) }; if (notes[key]) { notes[partKey(v)] = notes[key]; delete notes[key]; }
      commit(secs.map(s => (pieceKey(s) === key ? { ...s, part: v } : s)), { pieceNotes: notes });
    }
    if (a === 'notes') pieceNotesSheet(key);
    if (a === 'addsec') addSection(grp[grp.length - 1].id);
    if (a === 'dup') {
      const v = await askText('Duplicate piece', 'Name for the copy', name.replace(/^Left /, 'Right ') === name ? name + ' 2' : name.replace(/^Left /, 'Right ')); if (!v) return;
      const copy = grp.map(s => ({ ...structuredClone(s), id: rid(), part: v, reviewOk: s.reviewOk }));
      const at = secs.findIndex(x => x.id === grp[grp.length - 1].id) + 1;
      const notes = { ...(getP().pieceNotes || {}) }; if (notes[key]) notes[partKey(v)] = { ...notes[key] };
      commit([...secs.slice(0, at), ...copy, ...secs.slice(at)], { pieceNotes: notes });
    }
    if (a === 'up' || a === 'down') commit(moveGroup(secs, grp.map(x => x.id), a === 'up' ? -1 : 1, 'piece'));
    if (a === 'del' && (await confirmBox('Delete this piece?', `“${name}” and its ${grp.length} block${grp.length > 1 ? 's' : ''} will be removed, with their row counts.`))) {
      const ids = new Set(grp.map(x => x.id));
      commit(secs.filter(s => !ids.has(s.id)), { charts: (getP().charts || []).filter(c => !ids.has(c.link)) });
    }
  }
  async function sectionMenu(sid) {
    const secs = secsNow(), grp = groupOf(secs, sid, 'section'); if (!grp.length) return;
    const name = grp[0].section || 'Section';
    const a = await menu(name, [['rename', 'Rename section'], ['add', 'Add block'], ['up', 'Move section up'], ['down', 'Move section down'], ['ungroup', 'Remove the section (keep its blocks)'], ['del', 'Delete section and its blocks', 'danger']]);
    const ids = new Set(grp.map(x => x.id));
    if (a === 'rename') { const v = await askText('Rename section', 'Section name', name); if (v) commit(secs.map(s => (ids.has(s.id) ? { ...s, section: v } : s))); }
    if (a === 'add') addBlock(grp[grp.length - 1].id);
    if (a === 'up' || a === 'down') commit(moveGroup(secs, grp.map(x => x.id), a === 'up' ? -1 : 1, 'section'));
    if (a === 'ungroup') commit(secs.map(s => (ids.has(s.id) ? { ...s, section: '' } : s)));
    if (a === 'del' && (await confirmBox('Delete this section?', `“${name}” and its ${grp.length} block${grp.length > 1 ? 's' : ''} will be removed.`))) commit(secs.filter(s => !ids.has(s.id)), { charts: (getP().charts || []).filter(c => !ids.has(c.link)) });
  }
  async function blockMenu(sid) {
    const secs = secsNow(), i = secs.findIndex(s => s.id === sid); if (i < 0) return;
    const s = secs[i];
    const a = await menu(s.name || 'Block', [['edit', 'Edit'], ['up', 'Move up'], ['down', 'Move down'], ['dup', 'Duplicate'], ['del', 'Delete block', 'danger']]);
    if (a === 'edit') blockSheet(sid);
    if (a === 'up' && i > 0) { const pv = secs[i - 1]; [secs[i - 1], secs[i]] = [{ ...s, part: pv.part, section: pv.section }, pv]; commit(secs); }
    if (a === 'down' && i < secs.length - 1) { const nx = secs[i + 1]; [secs[i], secs[i + 1]] = [nx, { ...s, part: nx.part, section: nx.section }]; commit(secs); }
    if (a === 'dup') { secs.splice(i + 1, 0, { ...structuredClone(s), id: rid() }); commit(secs); }
    if (a === 'del' && (await confirmBox('Delete this block?', `“${s.name || 'Untitled'}” and its count will be removed.`))) { secs.splice(i, 1); commit(secs, { charts: (getP().charts || []).filter(c => c.link !== sid) }); }
  }
  async function addBlock(afterId) {
    const secs = secsNow(), i = secs.findIndex(s => s.id === afterId), ref = secs[i]; if (!ref) return;
    const a = await menu('Add block', [['rows', 'Rows: row counter, repeats, row-by-row'], ['stitches', 'Stitch count: cast on or pick up'], ['task', 'Text: a one-time step or note'], ['chart', 'Chart: track a chart row by row']]);
    if (!a) return;
    const s = newStep(ref.part, ref.section, a === 'chart' ? 'rows' : a, a === 'chart' ? 'Chart' : '');
    secs.splice(i + 1, 0, s);
    if (a === 'chart') {
      const ch = { id: rid(), name: 'Chart', rows: 14, cols: 10, perRow: 1, startNum: 1, oddSide: 'RS', link: s.id, cells: blankCells(14, 10), colors: DEF_COLORS.slice(), img: null, cur: 0, rep: 1, done: [], st: 0, stitchMode: false, focus: true, notes: '' };
      s.rows = 14;

  }
  async function addSection(afterId) {

  function pieceNotesSheet(key) {

  }

  /* ----- block editor sheet ----- */
  const remRow = m => `<div class="rem-row" data-rid="${esc(m.id)}">
      <select data-k="kind" aria-label="Reminder type"><option value="every" ${m.kind !== 'at' ? 'selected' : ''}>Every few rows</option><option value="at" ${m.kind === 'at' ? 'selected' : ''}>On one row</option></select>

  function blockForm(p, s) {

      ${ch ? `<div class="sb-chart-link">${IC.grid}<span>Linked chart: <b>${esc(ch.name)}</b> · ${ch.rows} rows × ${ch.cols} stitches</span><a class="btn small primary" href="#chartedit-${esc(id)}-${esc(ch.id)}">${chartFilled(ch) ? 'Edit chart' : 'Fill in chart'}</a></div>` : ''}
      ${k === 'rows' ? `<div class="sec-grid">

        <label class="f">Repeats<input type="number" min="1" data-k="repeats" value="${s.repeats ?? 1}"></label>

        <span class="sec-total">${t ? `${t} rows in this block` : 'Open-ended: count until the piece measures the right length, then finish the step.'}</span>`
      : `<div class="sec-grid">${k === 'stitches' ? `<label class="f">Stitches<input type="number" min="1" data-k="target" value="${s.target ?? ''}"></label>` : ''}
        <label class="f">PDF page<input type="number" min="1" data-k="page" value="${s.page ?? ''}"></label></div>`}
      <label class="f">${k === 'task' ? 'Text' : 'Instructions'}<textarea data-k="note" rows="3" placeholder="e.g. Loosely CO 94 sts using the long-tail method">${esc(s.note || '')}</textarea></label>
      ${k === 'rows' ? `<label class="f">Row-by-row instructions (one line per row of the repeat; shown one at a time while knitting)<textarea data-k="rowText" rows="${Math.min(10, Math.max(3, (s.rowText || []).length + 1))}" placeholder="RS: *K2, p2; rep from *&#10;WS: *P2, k2; rep from *">${esc((s.rowText || []).join('\n'))}</textarea></label>
      <div class="rems">${(s.reminders || []).map(remRow).join('')}</div>
      <div><button class="btn small" data-add-rem>＋ Reminder</button></div>` : ''}
    </div>`;
  }
  function blockSheet(sid) {
    let secs = secsNow(); const s0 = secs.find(x => x.id === sid); if (!s0) return;
    const m = modal(`<div style="display:flex;justify-content:space-between;align-items:center"><h2>Edit block</h2><button class="icon-btn" data-close aria-label="Done">×</button></div><div id="bsForm"></div>

      else s[k] = int(e.target.value);

    });

      const s = secs.find(x => x.id === sid);

    $('#bsDel', m.el).onclick = async () => {

      if (await confirmBox('Delete this block?', `“${s0.name || 'Untitled'}” and its count will be removed.`)) commit(secsNow().filter(x => x.id !== sid), { charts: (getP().charts || []).filter(c => c.link !== sid) });
    };
    draw();
  }

  /* ----- drag a block by its handle; drop on a block, a section or a piece ----- */
  let dragged = null;
  $b('#sbTree').addEventListener('pointerdown', e => {
    const g = e.target.closest('[data-grip]'); if (!g) return;
    e.preventDefault();
    const card = g.closest('.sb-card');
    const ghost = card.cloneNode(true); ghost.classList.add('sb-ghost');
    const r = card.getBoundingClientRect();
    Object.assign(ghost.style, { width: r.width + 'px', left: r.left + 'px', top: r.top + 'px' });
    document.body.append(ghost); card.classList.add('sb-dragging');
    const line = document.createElement('div'); line.className = 'sb-line'; document.body.append(line);
    dragged = { sid: g.dataset.grip, card, ghost, line, dy: e.clientY - r.top, target: null };
    let scrollT = null;
    const onMove = ev => {
      ghost.style.top = ev.clientY - dragged.dy + 'px';
      clearInterval(scrollT);
      if (ev.clientY < 90) scrollT = setInterval(() => window.scrollBy(0, -12), 16);
      else if (ev.clientY > innerHeight - 90) scrollT = setInterval(() => window.scrollBy(0, 12), 16);
      const cands = $$('.sb-card', $b('#sbTree')).filter(c => c !== card);
      let best = null;
      for (const c of cands) {
        const cr = c.getBoundingClientRect();
        if (ev.clientY >= cr.top && ev.clientY <= cr.bottom) { best = { c, after: c.classList.contains('block') ? ev.clientY > cr.top + cr.height / 2 : true }; break; }
      }
      if (!best) { line.hidden = true; dragged.target = null; return; }
      const cr = best.c.getBoundingClientRect();
      line.hidden = false;
      Object.assign(line.style, { left: cr.left + 'px', width: cr.width + 'px', top: (best.after ? cr.bottom + 5 : cr.top - 5) + 'px' });
      dragged.target = best;
    };
    const onUp = () => {
      clearInterval(scrollT);
      document.removeEventListener('pointermove', onMove); document.removeEventListener('pointerup', onUp); document.removeEventListener('pointercancel', onUp);
      const t = dragged.target; ghost.remove(); line.remove(); card.classList.remove('sb-dragging');
      const sid = dragged.sid; setTimeout(() => { dragged = null; }, 0);
      if (!t) return;
      const secs = secsNow(), from = secs.findIndex(s => s.id === sid), s = secs[from];
      secs.splice(from, 1);
      const el = t.c; let at, part, section;
      if (el.dataset.block) { const j = secs.findIndex(x => x.id === el.dataset.block); const ref = secs[j]; at = t.after ? j + 1 : j; part = ref.part; section = ref.section || ''; }
      else if (el.dataset.secid) { const j = secs.findIndex(x => x.id === el.dataset.secid); const ref = secs[j]; at = j; part = ref.part; section = ref.section || ''; }
      else { const j = secs.findIndex(x => x.id === el.dataset.piece); const ref = secs[j]; at = j; part = ref.part; section = ''; }
      if (at < 0) return;
      secs.splice(at, 0, { ...s, part, section });
      commit(secs);
    };
    document.addEventListener('pointermove', onMove); document.addEventListener('pointerup', onUp); document.addEventListener('pointercancel', onUp);

  /* ----- Claude builds the steps ----- */
  const aiOut = $b('#aiOut');
  $b('#aiGo').onclick = async () => {

    if (!pat) return toast('This project’s pattern was deleted.', 'err');
    if (!getP().size && pat.sizes && /[(,]/.test(pat.sizes)) {
      const v = await askText('Which size are you making?', 'Sizes in this pattern: ' + pat.sizes, '', 'e.g. S or 2');
      if (v === null) return;
      save('projects/' + id, { size: v });
    }
    if ((getP().sections || []).length && !(await confirmBox('Replace your current steps?', 'Claude will rebuild every piece, section and block from the PDF. Row counts on the current steps will be cleared. Charts you’ve already filled in are kept.', 'Rebuild'))) return;
    const btn = $b('#aiGo'); btn.disabled = true;
    aiOut.innerHTML = `<p class="muted" style="margin:10px 0 0">Claude is reading the pattern and writing out the steps. Long patterns can take a minute or two.</p>`;
    try {
      const mat = await patternMaterial(pat);
      const size = getP().size || '';
      const prompt = `You turn a knitting or crochet pattern into a step-by-step guide for a row-counting app. Here is the pattern${mat.images ? ' (attached as page images)' : ' (text extracted from a PDF; layout may be messy)'}.
${mat.text ? '"""\n' + mat.text + '\n"""' : ''}
Size being made: ${size || 'not given; use the first or smallest size and add a review note'}. Pick that size's numbers everywhere the pattern lists several, e.g. "94 (102, 110)" → the right one.

Structure:
- "part": the piece being made, in knitting order (e.g. Back, Left Front, Body, Sleeves, Collar, Finishing). When a piece is made more than once the same way, write its steps once and name it with the count, e.g. "Sleeves (×2)". When left and right pieces differ, write them as two parts named "Left …" and "Right …".
- "section": a named stage within the piece (e.g. "Ribbing", "Short rows", "Neck shaping", "Bottom border"). Several steps can share a section.
- Steps ("blocks") are one of:
  - "stitches": a cast-on, foundation chain or pick-up the knitter counts. Give "target" (the stitch count).
  - "rows": rows to work. Give "rows" (rows in ONE repeat; null when the pattern says to work until a measurement) and "repeats" (TOTAL times those rows are worked: "work Rows 1-2, then repeat them 15 more times" is repeats 16). Name a repeat in "repeatName". For flat work give "firstSide": "RS" or "WS" (null in the round). Give "rowText": one string per row of ONE repeat, written out for this size and starting with its side, e.g. "RS: K to the ds, resolve by knitting ds, K2, turn, make ds." Leave rowText empty for open-ended rows and put the instruction in note. At most 40 lines.
  - "task": a one-time action or note like "Break yarn", "Place sts on holder", "Block".
- Every step has "name" (short), "part", "section" (or ""), "page" (PDF page or null) and "note" (the instruction for this size, under 200 characters). Rows steps may have "reminders" counted from row 1 of the step: {"kind":"every","every":N,"from":F,"times":T,"text":"..."} or {"kind":"at","at":R,"text":"..."}.
- "review": add this to any step you are unsure about, as one short sentence saying what the knitter should check (an ambiguous count, a "work until" length, a choice the knitter must make, numbers you could not find for this size). Leave it out when you are confident.
- "pieces": for each part, "start" (how to begin it: where to attach yarn, which needle, what to pick up) and "end" (what to do when it is finished, e.g. "Cut yarn and fasten off"), when the pattern says so.
- "charts": every chart or grid the pattern uses: its "name", "part", "rows", "stitches" (width of one repeat as drawn), "page", "firstRowNumber" (number of its bottom row), "flat" (true/false), "oddSide" ("RS"/"WS" for flat work), and "step" (the exact name of the rows step in that part that works this chart; make sure that step exists).

Reply with only JSON:
{"steps":[{"part":"Back","section":"Ribbing","name":"Cast on","kind":"stitches","target":94,"page":2,"note":"Loosely CO 94 sts with the long-tail method."},{"part":"Back","section":"Ribbing","name":"Rib","kind":"rows","rows":2,"repeats":5,"repeatName":"Rib repeats","firstSide":"RS","page":2,"note":"","rowText":["RS: K2, *p2, k2; rep from *.","WS: P2, *k2, p2; rep from *."],"reminders":[],"review":"Pattern says 'about 5 repeats'; check the length."}],"pieces":[{"part":"Back","start":"","end":"Break yarn and hold sts."}],"charts":[{"name":"Lace chart","part":"Back","rows":14,"stitches":3,"page":4,"firstRowNumber":1,"flat":true,"oddSide":"WS","step":"Lace rows"}],"gauge":{"sts":22,"rows":30},"warnings":["short notes about assumptions that apply to the whole pattern"]}`;
      const res = await S.sample.json(prompt, aiOpts(mat));
      const raw = Array.isArray(res?.steps) ? res.steps : null;
      if (!raw || !raw.length) throw { code: 'empty' };
      let sug = raw.map(s => {
        const kind = ['rows', 'stitches', 'task'].includes(s.kind) ? s.kind : 'rows';
        return {
          id: rid(), part: String(s.part || ''), origPart: String(s.part || ''), section: String(s.section || ''), name: String(s.name || 'Step'), kind, rows: kind === 'rows' ? int(s.rows) : null, repeats: int(s.repeats) || 1,
          repeatName: String(s.repeatName || ''), firstSide: ['RS', 'WS'].includes(s.firstSide) ? s.firstSide : '',
          target: kind === 'stitches' ? int(s.target) : null, page: int(s.page), note: String(s.note || ''), review: s.review ? String(s.review).slice(0, 240) : '',
          rowText: kind === 'rows' && Array.isArray(s.rowText) ? s.rowText.map(String).filter(Boolean).slice(0, 60) : [],
          reminders: kind === 'rows' && Array.isArray(s.reminders) ? s.reminders.map(m => ({ id: rid(), kind: m.kind === 'at' ? 'at' : 'every', at: int(m.at), every: int(m.every), from: int(m.from), times: int(m.times), text: String(m.text || '') })) : []
        };
      });
      /* charts: link each to its rows step (created if missing) before pieces are split */
      const oldCharts = (getP().charts || []).filter(chartFilled);
      const newCharts = (Array.isArray(res.charts) ? res.charts : []).slice(0, 12).map(c => {
        const rows = Math.max(1, Math.min(400, int(c.rows) || 10)), cols = Math.max(1, Math.min(400, int(c.stitches) || 10));
        let step = sug.find(s => s.kind === 'rows' && s.name === String(c.step || '') && (!c.part || s.origPart === c.part)) || sug.find(s => s.kind === 'rows' && s.name === String(c.step || ''));
        if (!step) {
          const after = [...sug].reverse().find(s => s.origPart === String(c.part || '')) || sug[sug.length - 1];
          step = { id: rid(), part: after.part, origPart: after.origPart, section: after.section, name: String(c.name || 'Chart'), kind: 'rows', rows, repeats: 1, repeatName: '', firstSide: c.flat === false ? '' : 'RS', target: null, page: int(c.page), note: 'Work the chart.', review: '', rowText: [], reminders: [] };
          sug.splice(sug.indexOf(after) + 1, 0, step);
        }
        const odd = c.flat === false ? '' : (['RS', 'WS'].includes(c.oddSide) ? c.oddSide : 'RS');
        return { id: rid(), name: String(c.name || 'Chart').slice(0, 80), rows, cols, perRow: 1, startNum: parseInt(c.firstRowNumber, 10) || 1, oddSide: odd, link: step.id, cells: blankCells(rows, cols), colors: DEF_COLORS.slice(), img: null, page: int(c.page), trace: int(c.page) ? { page: int(c.page) } : null, cur: 0, rep: 1, done: [], st: 0, stitchMode: false, focus: true, notes: '' };
      });
      const pieceMap = {};
      (Array.isArray(res.pieces) ? res.pieces : []).forEach(x => { if (x?.part) pieceMap[String(x.part)] = { start: String(x.start || '').slice(0, 600), end: String(x.end || '').slice(0, 400) }; });
      sug = expandMultiples({ sections: sug })?.sections || sug;
      const pieceNotes = {};
      sug.forEach(s => { const n = pieceMap[s.origPart]; if (n && (n.start || n.end)) pieceNotes[pieceKey(s)] = n; delete s.origPart; });
      if (res.gauge && (num(res.gauge.sts) || num(res.gauge.rows)) && !(pat.gauge?.sts)) save('patterns/' + pat.id, { gauge: { sts: num(res.gauge.sts), rows: num(res.gauge.rows) } });
      const buildNotes = (Array.isArray(res.warnings) ? res.warnings : []).map(String).filter(Boolean).slice(0, 8);
      store.set('revHide:' + id, -1);
      commit(sug, { cur: sug[0].id, counts: {}, done: {}, partRound: {}, partCur: {}, knitBefore: 0, pieceNotes, buildNotes, charts: [...oldCharts, ...newCharts] });
      const nRev = reviewItems(getP(), pat).length;
      aiOut.innerHTML = `<p style="margin:10px 0 0;font-weight:600">Built ${partsOf(sug).length} pieces and ${sug.length} blocks${newCharts.length ? `, with ${newCharts.length} chart${newCharts.length > 1 ? 's' : ''} to fill in` : ''}.${nRev ? ` ${nRev} item${nRev > 1 ? 's' : ''} need${nRev > 1 ? '' : 's'} your review.` : ''}</p>`;
    } catch (e) {
      aiOut.innerHTML = `<p style="margin:10px 0 0;color:var(--danger);font-weight:600">${esc(aiError(e))}</p>`;
    } finally { btn.disabled = false; }
  };
  if (!S.sample) { $b('#sbAi').hidden = true; }
  render();
  return { update() { if (!dragged && !document.querySelector('.modal')) render(); } };
}

/* fills only empty fields, so nothing the knitter typed is overwritten */
async function autofillDetails(pat) {
  const mat = await patternMaterial(pat);
  const r = await S.sample.json(`Read this knitting pattern and pull out its details.
${mat.text ? '"""\n' + mat.text.slice(0, 30000) + '\n"""' : 'The pattern pages are attached as images.'}

Reply with only JSON, using null for anything the pattern doesn't say:
{"title":"pattern name","designer":"designer name","category":one of ${JSON.stringify(CATS)},"difficulty":one of ${JSON.stringify(LEVELS)} or null,"tags":["up to 5 short lowercase tags about construction or technique, e.g. top-down, cables"],"yarn":"yarn weight, the suggested yarn and total yardage","needles":"needle sizes and types","gauge":{"sts":stitches per 4 in / 10 cm as a number,"rows":rows per 4 in / 10 cm as a number},"sizes":"sizes offered","notions":"other supplies"}`,
    mat.images ? { images: mat.images, modelTier: 'default' } : { modelTier: 'default' });
  if (!r || typeof r !== 'object') throw { code: 'empty' };
  const cur = S.patterns.get(pat.id) || pat;
  const str = v => (typeof v === 'string' && v.trim() && !/^(null|n\/a|none|unknown)$/i.test(v.trim()) ? v.trim().slice(0, 300) : null);
  const patch = {}, filled = [];
  const put = (k, v, label) => { if (v != null && !(Array.isArray(cur[k]) ? cur[k].length : cur[k])) { patch[k] = v; filled.push(label); } };
  const title = str(r.title);
  const autoTitle = cur.titleAuto || (cur.pdfName && cur.title === titleFromFile(cur.pdfName));
  if (title && autoTitle && title !== cur.title) { patch.title = title; patch.titleAuto = false; filled.push('title'); }
  put('designer', str(r.designer), 'designer');
  put('category', CATS.includes(r.category) ? r.category : null, 'category');
  put('difficulty', LEVELS.includes(r.difficulty) ? r.difficulty : null, 'difficulty');
  put('tags', Array.isArray(r.tags) && r.tags.length ? r.tags.map(str).filter(Boolean).slice(0, 5).map(t => t.toLowerCase()) : null, 'tags');
  put('yarn', str(r.yarn), 'yarn');
  put('needles', str(r.needles), 'needles');
  put('sizes', str(r.sizes), 'sizes');
  put('notions', str(r.notions), 'notions');
  const gs = num(r.gauge?.sts), gr = num(r.gauge?.rows);
  if (!cur.gauge?.sts && (gs || gr)) { patch.gauge = { sts: gs, rows: gr }; filled.push('gauge'); }
  if (filled.length) save('patterns/' + pat.id, { ...patch, updatedAt: Date.now() });
  return filled;
}
const aiOpts = mat => (mat.images ? { images: mat.images, modelTier: 'complex' } : { modelTier: 'complex' });
function aiError(e) {
  switch (e?.code) {
    case 'not_granted': return 'Claude access is turned off for this page. You can allow it from the page’s permissions menu.';
    case 'rate_limited': return 'Too many requests just now. Try again in a minute.';
    case 'invalid_json': case 'empty': return 'Claude couldn’t make sense of this pattern. Try again, or add sections yourself.';
    case 'no_text': return 'This PDF has no readable text, and page images can’t be sent from this view.';
    case 'prompt_too_large': return 'This pattern is too long to send in one go.';
    default: return 'Claude couldn’t finish. Check your connection and try again.';
  }
}
async function patternMaterial(pat) {
  let text = pat.text || '';
  if (!text && S.db) { const d = await S.db.doc('patternText/' + pat.id).get().catch(() => null); text = d?.exists ? d.data().text || '' : ''; }
  text = text.slice(0, 60000);
  if (text.replace(/--- Page \d+ ---/g, '').trim().length >= 300 || !pat.pdf) return { text };
  const lim = await S.sample.limits().catch(() => null);
  if (!lim?.images) { if (text.trim()) return { text }; throw { code: 'no_text' }; }
  const pdf = await openPdfAsset(pat.pdf);
  const n = Math.min(pdf.numPages, lim.images.maxCount, 8);
  const images = [];
  for (let i = 1; i <= n; i++) images.push(await renderPageBlob(pdf, i, 1100, 0.8));
  return { text, images };
}

  const form = $('#gForm', body);
  form.addEventListener('change', e => {
    const f = e.target; if (!f.name) return;
    const v = num(f.value);
    if (f.name.startsWith('pat.')) { const pat = getPat(); if (pat) save('patterns/' + pat.id, { gauge: { ...(pat.gauge || {}), [f.name.slice(4)]: v } }); }
    else { const p = getP(); save('projects/' + id, { myGauge: { ...(p.myGauge || {}), [f.name.slice(3)]: v } }); }
    calc(); ratio();
  });
  const g = () => ({ pat: getPat()?.gauge || {}, my: getP().myGauge || {} });
  function ratio() {
    const { pat, my } = g();
    const parts = [];
    if (pat.sts && my.sts) {
      const r = my.sts / pat.sts;
      parts.push(`Stitches ×<b>${r.toFixed(3)}</b>. Knit as written, the piece comes out <b>${Math.abs((pat.sts / my.sts - 1) * 100).toFixed(0)}% ${my.sts < pat.sts ? 'wider' : 'narrower'}</b>.`);
    }
    if (pat.rows && my.rows) {
      const r = my.rows / pat.rows;
      parts.push(`Rows ×<b>${r.toFixed(3)}</b>. Knit as written, it comes out <b>${Math.abs((pat.rows / my.rows - 1) * 100).toFixed(0)}% ${my.rows < pat.rows ? 'longer' : 'shorter'}</b>.`);
    }
    $('#ratio', body).innerHTML = parts.join('<br>') || 'Fill in both gauges to see how far apart they are.';
  }
  function calc() {
    const { pat, my } = g();
    const k = $('#cK', body).value, n = num($('#cN', body).value);
    const a = pat[k], b = my[k];
    if (!n || !a || !b) { $('#cOut', body).textContent = '—'; $('#cWhy', body).textContent = `Needs both ${k === 'sts' ? 'stitch' : 'row'} gauges.`; return; }
    const raw = n * b / a;
    const m = int($('#cM', body).value), plus = int($('#cP', body).value) || 0;
    let out = Math.round(raw);
    if (m) out = Math.max(m + plus, Math.round((raw - plus) / m) * m + plus);
    const inches = n / a * 4;
    $('#cOut', body).textContent = out + (k === 'sts' ? ' sts' : ' rows');
    $('#cWhy', body).textContent = `${n} ÷ ${a} × ${b} = ${raw.toFixed(1)}${m ? `, rounded to ${m}n${plus ? '+' + plus : ''}` : ''}. That’s ${inches.toFixed(1)} in / ${(inches * 2.54).toFixed(1)} cm.`;
  }
  ['cN', 'cK', 'cM', 'cP'].forEach(i => $('#' + i, body).addEventListener('input', calc));
  const adjOut = $('#adjOut', body);
  function drawAdj() {
    const a = getP().adjust;
    if (!a) { adjOut.innerHTML = ''; return; }
    adjOut.innerHTML = `<p style="margin:0">${esc(a.summary || '')}</p>
      <div class="tbl-wrap"><table class="adj"><thead><tr><th>Where</th><th>Pattern</th><th>For you</th><th>Note</th></tr></thead><tbody>
      ${(a.items || []).map(r => `<tr><td>${esc(r.where)}</td><td class="old">${esc(r.original)}</td><td class="new">${esc(r.adjusted)}</td><td>${esc(r.note || '')}</td></tr>`).join('')}</tbody></table></div>
      <p class="muted" style="margin:0;font-size:.84rem">Worked out ${new Date(a.at).toLocaleDateString()} for ${esc(a.my)} vs pattern ${esc(a.pat)}. Double-check before casting on. Update row counts under Steps if you use these.</p>`;
  }
  $('#adjGo', body).onclick = async () => {
    const pat = getPat(); const { pat: pg, my } = g();
    if (!pat) return toast('This project’s pattern was deleted.', 'err');
    if (!(pg.sts && my.sts)) return toast('Fill in the pattern’s and your stitch gauge first.');
    const btn = $('#adjGo', body); btn.disabled = true;
    adjOut.innerHTML = `<p class="muted" style="margin:0">Claude is reworking the numbers. This can take up to a minute.</p>`;
    try {
      const mat = await patternMaterial(pat);
      const size = getP().size;
      const res = await S.sample.json(`You help a knitter adapt a pattern to their own gauge.
Pattern gauge: ${pg.sts} sts${pg.rows ? ` and ${pg.rows} rows` : ''} per 4 in / 10 cm.
Knitter's gauge: ${my.sts} sts${my.rows ? ` and ${my.rows} rows` : ''} per 4 in / 10 cm.
Size: ${size || 'not given; use the first or smallest size and say so in the summary'}.
${mat.text ? 'Pattern text (extracted from a PDF, layout may be messy):\n"""\n' + mat.text + '\n"""' : 'The pattern pages are attached as images.'}

Recalculate every stitch count and row count the knitter needs so the finished measurements match the pattern's measurements: cast-on, stitch counts after increases or decreases, stitches to pick up, row counts, and how often shaping repeats. Keep the stitch multiples the stitch patterns need (for example 2x2 rib needs a multiple of 4) and say how you rounded. Leave lengths given in inches or cm as they are. If row gauge is missing, only adjust stitches.
Reply with only JSON: {"summary":"one or two sentences","items":[{"where":"Cast on","original":"88 sts","adjusted":"80 sts","note":"multiple of 4 for rib"}]}`, aiOpts(mat));
      if (!res || !Array.isArray(res.items)) throw { code: 'empty' };
      const adjust = { at: Date.now(), summary: String(res.summary || ''), items: res.items.slice(0, 80).map(r => ({ where: String(r.where || ''), original: String(r.original || ''), adjusted: String(r.adjusted || ''), note: String(r.note || '') })), pat: `${pg.sts}/${pg.rows || '–'}`, my: `${my.sts}/${my.rows || '–'}` };
      save('projects/' + id, { adjust });
      drawAdj();
    } catch (e) { adjOut.innerHTML = `<p style="margin:0;color:var(--danger);font-weight:600">${esc(aiError(e))}</p>`; }
    finally { btn.disabled = false; }
  };
  if (!S.sample) { $('#adjGo', body).disabled = true; }
  function draw() {
    const { pat, my } = g();
    fillForm(form, k => (k.startsWith('pat.') ? pat[k.slice(4)] : my[k.slice(3)]));
    ratio(); calc(); drawAdj();
  }
  draw();
  return { update() { draw(); fit.update(); } };
}
/* ---------- fit to your measurements ----------
   project.measures = { unit: 'cm' | 'in', list: [{ key, name, how, value }] }
   project.fitCalc = { at, summary, items: [{ where, how, result, note }], updates: [{ id, target, rows, note }], review: [] } */
function fitPanel(host, id, getP, getPat) {
  host.innerHTML = `<div class="fit-h"><h2>Fit to your measurements</h2><div class="seg sm" id="fitUnit"><button type="button" data-u="cm">cm</button><button type="button" data-u="in">in</button></div></div>
    <p class="muted" style="margin:0">For made-to-measure patterns that say things like “chain Measurement A × 0.6, divisible by 8, plus 4”. Enter your measurements and gauge, and Claude works out every number for you.</p>
    <div id="fitList" class="fit-list"></div>
    <div class="fit-btns"><button class="btn small" id="fitFind">✦ Find measurements in the pattern</button><button class="btn small ghost" id="fitAdd">＋ Add measurement</button></div>
    <div class="fit-gauge" id="fitGauge"></div>
    <button class="btn primary" id="fitGo" style="justify-self:start">✦ Calculate stitches with Claude</button>
    <div id="fitOut"></div>`;
  const $f = s => $(s, host);
  const M = () => getP().measures || { unit: 'cm', list: [] };
  const putM = patch => save('projects/' + id, { measures: { ...M(), ...patch }, updatedAt: Date.now() });
  function drawList() {
    const m = M();
    $$('#fitUnit button', host).forEach(b => b.classList.toggle('on', b.dataset.u === (m.unit || 'cm')));
    $f('#fitList').innerHTML = m.list.length ? m.list.map((x, i) => `<div class="fit-row" data-i="${i}">
        <input type="text" class="fit-key" data-mk="key" value="${esc(x.key || '')}" aria-label="Label" placeholder="A">
        <div class="fit-name"><input type="text" data-mk="name" value="${esc(x.name || '')}" placeholder="What to measure, e.g. Underbust" aria-label="Measurement name">${x.how ? `<small>${esc(x.how)}</small>` : ''}</div>
        <label class="fit-val"><input type="number" step="0.1" min="0" data-mk="value" value="${x.value ?? ''}" placeholder="0" aria-label="${esc(x.name || 'Value')}"><span>${esc(m.unit || 'cm')}</span></label>
        <button class="icon-btn" data-mdel="${i}" aria-label="Remove measurement">×</button></div>`).join('')
      : `<p class="muted" style="margin:0;font-size:.9rem">No measurements yet. Tap “Find measurements in the pattern”, or add your own.</p>`;
    const p = getP(), pg = getPat()?.gauge || {}, my = p.myGauge || {};
    $f('#fitGauge').innerHTML = `<span class="eyebrow">Gauge used</span> <span>${my.sts ? `Yours: <b>${my.sts}</b> sts${my.rows ? ` × <b>${my.rows}</b> rows` : ''} per 10 cm / 4 in` : pg.sts ? `The pattern’s: <b>${pg.sts}</b> sts${pg.rows ? ` × <b>${pg.rows}</b> rows` : ''} (enter your own gauge on the left if it differs)` : '<b>None yet.</b> Enter your gauge on the left so the numbers fit your stitches.'}</span>`;
  }
  $f('#fitUnit').onclick = e => { const b = e.target.closest('[data-u]'); if (b) { putM({ unit: b.dataset.u }); drawList(); } };
  $f('#fitList').addEventListener('change', e => {
    const k = e.target.dataset.mk; if (!k) return;
    const i = +e.target.closest('[data-i]').dataset.i, list = M().list.map(x => ({ ...x }));
    list[i][k] = k === 'value' ? num(e.target.value) : e.target.value.trim();
    putM({ list });
  });
  $f('#fitList').addEventListener('click', e => { const d = e.target.closest('[data-mdel]'); if (d) { const list = M().list.slice(); list.splice(+d.dataset.mdel, 1); putM({ list }); drawList(); } });
  $f('#fitAdd').onclick = () => { const list = M().list.slice(); list.push({ key: String.fromCharCode(65 + list.length), name: '', how: '', value: null }); putM({ list }); drawList(); $$('.fit-row input[data-mk="name"]', host).pop()?.focus(); };

  $f('#fitFind').onclick = async () => {
    const pat = getPat(); if (!pat) return toast('This project’s pattern was deleted.', 'err');
    const btn = $f('#fitFind'); btn.disabled = true; btn.textContent = 'Reading the pattern…';
    try {
      const mat = await patternMaterial(pat);
      const res = await S.sample.json(`This is a knitting or crochet pattern${mat.images ? ' (page images attached)' : ''}.
${mat.text ? '"""\n' + mat.text + '\n"""' : ''}
List every body measurement the maker has to take for this pattern (for example "Measurement A: underbust circumference"). Keep the pattern's own labels (A, B, C… or names) and say how to measure each, from the pattern, in one short sentence. Also say which unit the pattern uses.
Reply with only JSON: {"unit":"cm","measurements":[{"key":"A","name":"Underbust circumference","how":"Measure snugly around your ribcage just under the bust."}]}`, { ...aiOpts(mat), modelTier: 'default' });
      const found = Array.isArray(res?.measurements) ? res.measurements : [];
      if (!found.length) { toast('Claude didn’t find body measurements in this pattern. You can add your own.'); return; }
      const old = M().list, list = found.slice(0, 20).map(x => {
        const prev = old.find(o => (o.key && o.key === String(x.key || '')) || (o.name && o.name.toLowerCase() === String(x.name || '').toLowerCase()));
        return { key: String(x.key || '').slice(0, 8), name: String(x.name || '').slice(0, 80), how: String(x.how || '').slice(0, 200), value: prev?.value ?? null };
      });
      putM({ list, unit: res.unit === 'in' ? 'in' : res.unit === 'cm' ? 'cm' : M().unit || 'cm' });
      drawList(); toast(`Found ${list.length} measurement${list.length > 1 ? 's' : ''}. Fill in your numbers.`);
    } catch (e) { toast(esc(aiError(e)), 'err', 5000); }
    finally { btn.disabled = false; btn.textContent = '✦ Find measurements in the pattern'; }
  };

  function drawOut() {
    const fc = getP().fitCalc, out = $f('#fitOut');
    if (!fc) { out.innerHTML = ''; return; }
    out.innerHTML = `${fc.summary ? `<p style="margin:0">${esc(fc.summary)}</p>` : ''}
      <div class="tbl-wrap"><table class="adj fit-tbl"><thead><tr><th>Where</th><th>How it’s worked out</th><th>For you</th></tr></thead><tbody>
      ${(fc.items || []).map(r => `<tr><td>${esc(r.where)}${r.note ? `<br><small class="muted">${esc(r.note)}</small>` : ''}</td><td class="fx">${esc(r.how)}</td><td class="new">${esc(r.result)}</td></tr>`).join('')}</tbody></table></div>
      ${(fc.review || []).length ? `<div class="rv-banner">${IC.warn}<span>${fc.review.map(esc).join('<br>')}</span></div>` : ''}
      <p class="muted" style="margin:0;font-size:.84rem">Worked out ${new Date(fc.at).toLocaleDateString()} from ${esc(fc.basis || '')}. Double-check before you start.</p>
      ${(fc.updates || []).length ? `<div class="fit-apply"><span>${fc.updates.length} step${fc.updates.length > 1 ? 's' : ''} can be updated with these numbers.</span>${fc.applied ? '<span class="pill ok">Applied to your steps</span>' : '<button class="btn primary small" id="fitApply">Apply to my steps</button>'}</div>` : ''}`;
    const ap = $f('#fitApply');
    if (ap) ap.onclick = () => {
      const ups = new Map(fc.updates.map(u => [u.id, u]));
      const secs = (getP().sections || []).map(s => {
        const u = ups.get(s.id); if (!u) return s;
        const n = { ...s, reviewOk: false, review: u.review || '' };
        if (u.target && kindOf(s) === 'stitches') n.target = u.target;
        if (u.rows && kindOf(s) === 'rows') n.rows = u.rows;
        if (u.note) n.note = u.note;
        if (!n.review) n.reviewOk = true;
        return n;
      });
      save('projects/' + id, { sections: secs, fitCalc: { ...fc, applied: true }, updatedAt: Date.now() });
      toast('Your steps now use these numbers.'); drawOut();
    };
  }
  $f('#fitGo').onclick = async () => {
    const pat = getPat(), p = getP(), m = M();
    if (!pat) return toast('This project’s pattern was deleted.', 'err');
    const filled = m.list.filter(x => x.value != null && x.value !== '');
    if (!filled.length) return toast('Enter at least one measurement first.', 'err');
    const btn = $f('#fitGo'); btn.disabled = true; btn.textContent = 'Claude is working out your numbers…';
    try {
      const mat = await patternMaterial(pat);
      const pg = pat.gauge || {}, my = p.myGauge || {};
      const gaugeTxt = my.sts ? `${my.sts} sts${my.rows ? ' and ' + my.rows + ' rows' : ''} per 10 cm / 4 in (the maker's own swatch)` : pg.sts ? `${pg.sts} sts${pg.rows ? ' and ' + pg.rows + ' rows' : ''} per 10 cm / 4 in (the pattern's gauge)` : 'unknown: use the pattern gauge if it states one';
      const steps = (p.sections || []).map(s => ({ id: s.id, part: s.part, section: s.section || '', name: s.name, kind: kindOf(s), rows: s.rows, target: s.target, note: (s.note || '').slice(0, 160) }));
      const res = await S.sample.json(`You calculate the numbers in a made-to-measure knitting or crochet pattern for one maker.
Pattern${mat.images ? ' (page images attached)' : ''}:
${mat.text ? '"""\n' + mat.text + '\n"""' : ''}
Size: ${p.size || 'not given'}.
Gauge: ${gaugeTxt}.
Measurements (${m.unit || 'cm'}): ${filled.map(x => `${x.key ? x.key + ' ' : ''}${x.name || ''} = ${x.value}`).join('; ')}.
The maker's current steps (JSON): ${JSON.stringify(steps).slice(0, 12000)}

Work out every number that depends on these measurements or the gauge: starting chains or cast-on counts, stitch counts, rows or rounds to work, lengths, and anything the pattern computes from a formula. Follow the pattern's own rules exactly, including rounding to a multiple (for example "divisible by 8, then add 4" → round to the nearest valid number). Show the math with the real numbers in "how". When the pattern offers options (closure type, cup size), use the one that fits the measurements and say which in "note"; if you cannot tell, add a line to "review".
Then say which of the maker's steps should change: give the step "id" and the new "target" (stitch count, for stitches steps), "rows" (for rows steps) and/or a rewritten "note" with the maker's numbers. Add a short "review" sentence to an update when you are unsure.
Reply with only JSON: {"summary":"one or two sentences","items":[{"where":"Foundation chain","how":"86 cm × 0.6 = 51.6 cm; 51.6 × 1.8 ch/cm = 92.9 → 88 (÷8) + 4","result":"92 ch","note":"lace-up closure, C cup or smaller"}],"updates":[{"id":"step id","target":92,"note":"Ch 92."}],"review":["things the maker should check"]}`, { ...aiOpts(mat), modelTier: 'complex' });
      if (!res || !Array.isArray(res.items)) throw { code: 'empty' };
      const ids = new Set((p.sections || []).map(s => s.id));
      const fitCalc = {
        at: Date.now(), applied: false, summary: String(res.summary || ''),
        basis: `${filled.map(x => `${x.key || x.name} ${x.value} ${m.unit || 'cm'}`).join(', ')} · ${my.sts ? 'your gauge' : 'pattern gauge'}`,
        items: res.items.slice(0, 60).map(r => ({ where: String(r.where || ''), how: String(r.how || ''), result: String(r.result || ''), note: String(r.note || '') })),
        updates: (Array.isArray(res.updates) ? res.updates : []).filter(u => ids.has(u.id)).slice(0, 80).map(u => ({ id: u.id, target: int(u.target), rows: int(u.rows), note: u.note ? String(u.note).slice(0, 300) : '', review: u.review ? String(u.review).slice(0, 200) : '' })),
        review: (Array.isArray(res.review) ? res.review : []).map(String).filter(Boolean).slice(0, 8)
      };
      save('projects/' + id, { fitCalc, updatedAt: Date.now() });
      drawOut();
    } catch (e) { toast(esc(aiError(e)), 'err', 5000); }
    finally { btn.disabled = false; btn.textContent = '✦ Calculate stitches with Claude'; }
  };
  if (!S.sample) { $f('#fitFind').hidden = true; $f('#fitGo').hidden = true; }
  drawList(); drawOut();
  return { update() { if (!host.contains(document.activeElement)) { drawList(); drawOut(); } } };
}


/* ---------- boot ---------- */
route();
(async () => {
  const c = window.claude;
  if (!c?.use) { S.noDb = true; route(); return; }
  const [db, assets, sample, user, downloads] = await Promise.all(['db', 'assets', 'sample', 'user', 'downloads'].map(n => c.use(n).catch(() => null)));
  S.assets = assets; S.sample = sample; S.downloads = downloads;
  user?.name().then(n => { S.userName = n || ''; onData(); }).catch(() => {});
  if (!db) { S.noDb = true; route(); return; }
  S.db = db;
  const sub = (col, map) => db.collection(col).onSnapshot(snap => {
    S[map] = new Map(snap.docs.map(d => [d.id, { id: d.id, ...withPending(col + '/' + d.id, d.data()) }]));
    S.loaded[map] = true;
    onData();
  }, () => { S.loaded[map] = true; onData(); });
  sub('patterns', 'patterns');
  sub('projects', 'projects');
  setTimeout(idleCheck, 3000);
  route();
})();
</script>
