<script>
/* Offline storage: stands in for claude.ai so the same app runs from this device.
   Documents and files live in IndexedDB; the service worker serves files at ./_blob/<id>. */
(() => {
  const NAME = 'purlpage';
  let dbp = null;
  const idb = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open(NAME, 1);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('docs')) d.createObjectStore('docs'); if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const done = t => new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  const store = async (name, mode) => (await idb()).transaction(name, mode);
  const getDoc = async path => req((await store('docs')).objectStore('docs').get(path));
  const putDoc = async (path, v) => { const t = await store('docs', 'readwrite'); t.objectStore('docs').put(v, path); await done(t); };
  const delDoc = async path => { const t = await store('docs', 'readwrite'); t.objectStore('docs').delete(path); await done(t); };
  async function listCol(col) {
    const s = (await store('docs')).objectStore('docs'), range = IDBKeyRange.bound(col + '/', col + '/￿');
    const [keys, vals] = await Promise.all([req(s.getAllKeys(range)), req(s.getAll(range))]);
    return keys.map((k, i) => [k.slice(col.length + 1), vals[i]]).filter(([id]) => !id.includes('/'));
  }
  const plain = v => v && typeof v === 'object' && !Array.isArray(v);
  const merge = (a, b) => { const o = { ...a }; for (const [k, v] of Object.entries(b)) o[k] = plain(v) && plain(a[k]) ? merge(a[k], v) : v; return o; };
  const clean = v => JSON.parse(JSON.stringify(v));
  const snapOf = entries => { const docs = entries.map(([id, d]) => ({ id, exists: true, data: () => d, metadata: { fromCache: false, hasPendingWrites: false } })); return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } }; };
  const listeners = new Map();
  const notify = col => { const set = listeners.get(col); if (set?.size) listCol(col).then(e => set.forEach(fn => fn(snapOf(e)))); };
  const hex = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
  const docRef = path => {
    const col = path.split('/').slice(0, -1).join('/'), id = path.split('/').pop();
    return {
      id, path,
      async get() { const v = await getDoc(path); return { id, exists: v !== undefined, data: () => v, metadata: {} }; },
      async set(v) { await putDoc(path, clean(v)); notify(col); },
      async update(v) { const cur = await getDoc(path); if (cur === undefined) throw { code: 'invalid_argument', message: 'Document does not exist' }; await putDoc(path, merge(cur, clean(v))); notify(col); },
      async delete() { await delDoc(path); notify(col); },
      onSnapshot(next) { const fn = () => this.get().then(next); const c = listeners.get(col) || new Set(); listeners.set(col, c); c.add(fn); fn(); return () => c.delete(fn); },
      collection: sub => colRef(path + '/' + sub)
    };
  };
  const colRef = col => {
    const q = {
      path: col,
      doc: id => docRef(col + '/' + (id || hex())),
      async add(v) { const r = docRef(col + '/' + hex()); await r.set(v); return r; },
      async get() { return snapOf(await listCol(col)); },
      onSnapshot(next, err) { const c = listeners.get(col) || new Set(); listeners.set(col, c); c.add(next); listCol(col).then(e => next(snapOf(e))).catch(e => err?.(e)); return () => c.delete(next); },
      where: () => q, orderBy: () => q, limit: () => q
    };
    return q;
  };
  const db = { doc: docRef, collection: colRef };
  const assets = {
    async upload(blob, opts = {}) {
      const id = hex(), type = opts.type || blob.type || 'application/octet-stream';
      const t = await store('blobs', 'readwrite'); t.objectStore('blobs').put({ blob, type }, id); await done(t);
      try { navigator.storage?.persist?.(); } catch {}
      return { id, url: './_blob/' + id, sizeBytes: blob.size, contentType: type };
    },
    async delete(id) { const t = await store('blobs', 'readwrite'); t.objectStore('blobs').delete(id); await done(t); return { deleted: true }; },
    async list() { const s = (await store('blobs')).objectStore('blobs'); const keys = await req(s.getAllKeys()); return { assets: keys.map(id => ({ id, url: './_blob/' + id })), usage: {} }; }
  };
  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data]);
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      return { status: 'saved' };
    }
  };
  let nameV = ''; try { nameV = localStorage.getItem('pp:name') || ''; } catch {}
  const user = { name: async () => nameV, isOwner: () => true, canEdit: () => true };
  const caps = { db, assets, downloads, user };
  window.claude = { use: async n => caps[n] || null };
  window.PP_OFFLINE = true;
  /* the service worker caches the app and serves stored files; a page that loads before it is in control reloads once */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(() => navigator.serviceWorker.ready).then(() => {
      try { if (!navigator.serviceWorker.controller && !sessionStorage.getItem('pp:swReload')) { sessionStorage.setItem('pp:swReload', '1'); location.reload(); } } catch {}
    }).catch(() => {});
  }
})();

</script>

<style>
/* Layout: library grid → pattern sheet → project workbench (PDF on the left, row counter docked right on desktop, docked bottom on phones) */
:root {
  --bg: #F4F2F6;
  --surface: #FFFFFF;
  --surface-2: #ECE7F0;
  --ink: #231B2C;
  --muted: #6B6177;
  --line: #DCD4E3;
  --accent: #8E2C5C;
  --accent-ink: #FFFFFF;
  --accent-soft: #F4E2EC;
  --remind: #9A6110;
  --remind-soft: #FCEFD6;
  --ok: #2F6E46;
  --ok-soft: #E1F1E6;
  --danger: #B42335;
  --hl: rgba(255, 213, 0, .38);
  --marker: rgba(142, 44, 92, .16);
  --shadow: 0 1px 2px rgba(35, 27, 44, .06), 0 8px 24px rgba(35, 27, 44, .08);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --hdr: 58px;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131B; --surface: #221C28; --surface-2: #2D2634; --ink: #F2EDF5; --muted: #A99EB4;
    --line: #3B3343; --accent: #E37FB1; --accent-ink: #2B0E1D; --accent-soft: #3D2131;
    --remind: #F2BC57; --remind-soft: #3A2C12; --ok: #7BC596; --ok-soft: #1D3326; --danger: #F07A88;
    --marker: rgba(227, 127, 177, .22); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17131B; --surface: #221C28; --surface-2: #2D2634; --ink: #F2EDF5; --muted: #A99EB4;
  --line: #3B3343; --accent: #E37FB1; --accent-ink: #2B0E1D; --accent-soft: #3D2131;
  --remind: #F2BC57; --remind-soft: #3A2C12; --ok: #7BC596; --ok-soft: #1D3326; --danger: #F07A88;
  --marker: rgba(227, 127, 177, .22); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.2rem); font-weight: 800; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sub { color: var(--muted); margin: 4px 0 0; }
.eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header.top .wrap { height: var(--hdr); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--display); font-weight: 800; font-size: 1.2rem; letter-spacing: -.02em; }
.brand svg { width: 30px; height: 30px; flex: none; }
.topnav { display: flex; gap: 4px; }
.topnav a { text-decoration: none; padding: 8px 14px; border-radius: 999px; font-weight: 600; color: var(--muted); }
.topnav a[aria-current="page"] { background: var(--surface-2); color: var(--ink); }
.tabbar { display: none; }
@media (max-width: 760px) {
  .topnav { display: none; }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); gap: 8px; }
  .tabbar a { flex: 1; text-align: center; text-decoration: none; padding: 8px; border-radius: 12px; font-weight: 600; color: var(--muted); }
  .tabbar a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  main { padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
  body.in-project .tabbar { display: none; }
  body.in-project main { padding-bottom: 0; }
}

/* buttons & fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 32px; padding: 4px 12px; font-size: .88rem; }
.btn[disabled] { opacity: .5; cursor: default; }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 1rem; line-height: 1; }
.icon-btn:hover { border-color: var(--muted); }
.icon-btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
label.f { display: grid; gap: 4px; font-size: .82rem; font-weight: 600; color: var(--muted); min-width: 0; }
input[type=text], input[type=search], input[type=number], input[type=url], input[type=date], select, textarea {
  width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-weight: 500; font-size: 15px; }
textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stack { display: grid; gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.panel > summary { cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 1.05rem; list-style: none; display: flex; justify-content: space-between; }
.panel > summary::after { content: "Show"; font-family: var(--body); font-size: .82rem; color: var(--muted); font-weight: 600; }
.panel[open] > summary::after { content: "Hide"; }
.panel[open] > summary { margin-bottom: 14px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .76rem; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.live { background: var(--accent-soft); color: var(--accent); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.ex { background: var(--remind-soft); color: var(--remind); }
.page { padding-block: 28px 48px; }

/* library */
.lib-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }
.lib-tools { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.lib-tools input { flex: 1 1 260px; }
.lib-tools select { flex: 0 0 auto; width: auto; }
.chips { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chip { flex: none; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .88rem; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; margin-top: 20px; }
@media (max-width: 460px) { .grid { grid-template-columns: 1fr 1fr; gap: 12px; } }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.card .cover { position: absolute; inset: 0; z-index: 1; }
.thumb { aspect-ratio: 4 / 5; max-width: 100%; background: var(--surface-2); overflow: hidden; display: grid; place-items: center; border-bottom: 1px solid var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; background: #fff; }
.thumb .ph { font-family: var(--display); font-weight: 800; font-size: 2.2rem; color: var(--muted); opacity: .6; }
.card .meta { padding: 12px 14px 14px; display: grid; gap: 6px; min-width: 0; }
.card h3 { font-size: .98rem; overflow-wrap: anywhere; }
.card .by { font-size: .84rem; color: var(--muted); margin: -4px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.fav { position: absolute; z-index: 2; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; border: none; background: color-mix(in srgb, var(--surface) 88%, transparent); cursor: pointer; display: grid; place-items: center; color: var(--muted); box-shadow: var(--shadow); }
.fav svg { width: 18px; height: 18px; }
.fav[aria-pressed="true"] { color: var(--accent); }
.empty { text-align: center; padding: 56px 20px; border: 2px dashed var(--line); border-radius: 20px; margin-top: 20px; display: grid; gap: 12px; justify-items: center; }
.empty p { max-width: 46ch; margin: 0; color: var(--muted); }
.uploads { display: grid; gap: 8px; margin-top: 16px; }
.upl { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: .9rem; }
.upl .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.upl .s { color: var(--muted); }
.upl.err .s { color: var(--danger); }
.drop-on { outline: 3px dashed var(--accent); outline-offset: -8px; border-radius: 20px; }

/* projects list */
.plist { display: grid; gap: 14px; margin-top: 18px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
@media (max-width: 460px) { .plist { grid-template-columns: 1fr; } }
.pcard { position: relative; display: grid; grid-template-columns: 76px 1fr; gap: 14px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; align-items: center; }
.pcard:hover { box-shadow: var(--shadow); }
.pcard .thumb { aspect-ratio: 4/5; border-radius: 8px; border: 1px solid var(--line); }
.pcard .thumb .ph { font-size: 1.3rem; }
.pcard .info { min-width: 0; display: grid; gap: 4px; }
.pcard .where { font-size: .88rem; color: var(--muted); }
.group-h { margin-top: 34px; display: flex; align-items: baseline; gap: 10px; }

/* progress bar with a knit-stitch texture */
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background-color: var(--accent);
  background-image: linear-gradient(60deg, rgba(255,255,255,.28) 25%, transparent 25%), linear-gradient(-60deg, rgba(255,255,255,.28) 25%, transparent 25%);
  background-size: 8px 10px; transition: width .25s; }
.bar.done i { background-color: var(--ok); }

/* pattern sheet */
.crumbs a { text-decoration: none; color: var(--muted); font-weight: 600; }
.pat-head { display: flex; justify-content: space-between; align-items: start; gap: 16px; flex-wrap: wrap; margin: 10px 0 20px; }
.pat-head h1 { min-width: 0; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.pat-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
.pat-grid .side { display: grid; gap: 16px; position: sticky; top: calc(var(--hdr) + 16px + env(safe-area-inset-top, 0px)); }
@media (max-width: 960px) { .pat-grid { grid-template-columns: minmax(0, 1fr); } .pat-grid .side { position: static; order: -1; } }
.mini-proj { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); text-decoration: none; }
.mini-proj:first-of-type { border-top: 0; }

/* viewer */
.viewer { min-width: 0; }
.vbar { position: sticky; top: calc(var(--hdr) + env(safe-area-inset-top, 0px)); z-index: 12; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 0; background: var(--bg); }
.vbar .sp { flex: 1; }
.vbar select { width: auto; min-height: 36px; padding: 4px 8px; }
.vgroup { display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
.vgroup .icon-btn { border-color: transparent; background: transparent; width: auto; min-width: 36px; padding: 0 10px; font-size: .84rem; font-weight: 700; }
.vgroup .icon-btn.on { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.pages { overflow-x: auto; display: grid; gap: 14px; justify-items: center; padding-bottom: 12px; }
.pg { position: relative; background: #fff; box-shadow: var(--shadow); border-radius: 4px; max-width: none; }
.pg canvas { display: block; width: 100%; height: 100%; border-radius: 4px; }
.pg .pnum { position: absolute; left: -2px; top: 6px; transform: translateX(-100%); font-size: .72rem; color: var(--muted); font-weight: 700; padding-right: 6px; }
.ov { position: absolute; inset: 0; pointer-events: none; }
.mode-marker .ov, .mode-highlight .ov, .mode-erase .ov { pointer-events: auto; cursor: crosshair; }
.mode-highlight .ov { touch-action: none; }
.mk { position: absolute; left: -6px; right: -6px; background: var(--marker); border-top: 2px solid var(--accent); border-bottom: 2px solid var(--accent); pointer-events: none; }
.mk::before { content: ""; position: absolute; left: -2px; top: 50%; width: 12px; height: 12px; background: var(--accent); transform: translate(-50%, -50%) rotate(45deg); border-radius: 2px; }
.hl { position: absolute; background: var(--hl); mix-blend-mode: multiply; border-radius: 2px; }
.mode-erase .hl { outline: 2px dashed var(--danger); cursor: pointer; }
.ptext { white-space: pre-wrap; font-family: var(--body); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; width: 100%; max-width: 760px; margin: 0; line-height: 1.7; overflow-wrap: anywhere; }
.vmsg { padding: 40px 20px; text-align: center; color: var(--muted); }

/* project */
.proj-head { padding-block: 16px 0; display: grid; gap: 10px; }
.proj-head .back { text-decoration: none; color: var(--muted); font-weight: 600; font-size: .9rem; }
.proj-head .ttl { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.proj-head h1 { min-width: 0; overflow-wrap: anywhere; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: none; background: none; border: none; padding: 10px 14px; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
.knit { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; padding-block: 8px 40px; }
.counter { position: sticky; top: calc(var(--hdr) + 16px + env(safe-area-inset-top, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 14px; max-height: calc(100vh - var(--hdr) - 32px); overflow-y: auto; }
.c-compact { display: none; }
.c-top { display: flex; justify-content: space-between; align-items: center; }
.c-collapse { display: none; }
.c-name { font-size: 1.5rem; overflow-wrap: anywhere; }
.c-big { display: flex; align-items: baseline; gap: 10px; }
.c-big .n { font-family: var(--display); font-weight: 800; font-size: 4.6rem; line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.c-big .of { color: var(--muted); font-weight: 600; font-size: 1.05rem; }
.c-rep { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.c-rep .pill { font-size: .82rem; }
.rem { display: grid; gap: 6px; }
.rem-now { background: var(--remind-soft); color: var(--remind); border-radius: 12px; padding: 10px 12px; font-weight: 700; display: flex; gap: 8px; align-items: start; }
.rem-now svg { flex: none; width: 18px; height: 18px; margin-top: 2px; }
.rem-next { font-size: .88rem; color: var(--muted); }
.rem-next b { color: var(--ink); }
.c-btns { display: grid; grid-template-columns: 72px 1fr; gap: 10px; }
.c-minus, .c-plus { border: none; border-radius: 16px; cursor: pointer; font-weight: 800; font-family: var(--display); }
.c-minus { background: var(--surface-2); font-size: 1.8rem; min-height: 64px; }
.c-plus { background: var(--accent); color: var(--accent-ink); font-size: 1.3rem; min-height: 64px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.c-plus:active, .c-minus:active { transform: scale(.98); }
.c-sec2 { display: flex; gap: 8px; flex-wrap: wrap; }
.c-note { font-size: .9rem; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.c-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.c-list button { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; background: none; border: none; border-radius: 10px; padding: 8px 10px; cursor: pointer; }
.c-list button:hover { background: var(--surface-2); }
.c-list li.cur button { background: var(--accent-soft); }
.c-list .nm { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-list .ct { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.c-list .bar { grid-column: 1 / -1; height: 6px; }
.c-total { font-size: .86rem; color: var(--muted); margin: 0; }
.c-done { text-align: center; display: grid; gap: 10px; padding: 10px 0; }
@media (max-width: 960px) {
  .knit { grid-template-columns: minmax(0, 1fr); padding-bottom: 140px; }
  .counter { position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 25; border-radius: 20px 20px 0 0; border-bottom: 0; max-height: 82vh;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .counter.collapsed .c-full { display: none; }
  .counter.collapsed .c-compact { display: grid; }
  .c-collapse { display: inline-flex; }
}
.c-compact { grid-template-columns: 1fr 56px 112px; gap: 10px; align-items: stretch; }
.c-expand { text-align: left; background: none; border: none; padding: 0; cursor: pointer; min-width: 0; display: grid; gap: 1px; }
.c-expand .s1 { font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-expand .s2 { font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.c-expand .s2 small { font-size: .95rem; color: var(--muted); font-weight: 600; }
.c-expand .s3 { font-size: .8rem; font-weight: 700; color: var(--remind); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-compact .c-minus, .c-compact .c-plus { min-height: 58px; }

/* sections editor */
.sec-wrap { padding-block: 20px 60px; display: grid; gap: 16px; max-width: 880px; }
.sec-intro { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: end; }
.sec-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.sec-card .hd { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; }
.sec-card .idx { font-family: var(--display); font-weight: 800; color: var(--muted); text-align: center; }
.sec-card .hd input { font-weight: 700; }
.sec-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.sec-total { font-size: .86rem; color: var(--muted); }
.rems { display: grid; gap: 8px; }
.rem-row { display: grid; grid-template-columns: 130px auto 1fr 36px; gap: 8px; align-items: center; background: var(--remind-soft); border-radius: 10px; padding: 8px; }
.rem-row .nums { display: flex; gap: 6px; align-items: center; font-size: .84rem; font-weight: 600; color: var(--muted); flex-wrap: wrap; }
.rem-row .nums input { width: 64px; min-height: 34px; padding: 4px 6px; }
.rem-row select, .rem-row input[type=text] { min-height: 34px; padding: 4px 8px; }
@media (max-width: 640px) {
  .sec-grid { grid-template-columns: 1fr 1fr; }
  .rem-row { grid-template-columns: 1fr 36px; }
  .rem-row .nums, .rem-row input[type=text] { grid-column: 1 / 2; }
}
.ai-box { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; background: var(--surface); display: grid; gap: 10px; }
.ai-box.busy { opacity: .85; }
.ai-list { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* notes, gauge */
.two-col { padding-block: 20px 60px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .two-col { grid-template-columns: minmax(0, 1fr); } }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.photos button { padding: 0; border: 0; border-radius: 10px; overflow: hidden; aspect-ratio: 1; max-width: 100%; cursor: pointer; background: var(--surface-2); }
.photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gauge-sq { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ratio { font-size: .95rem; background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.ratio b { font-variant-numeric: tabular-nums; }
.calc-out { font-family: var(--display); font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; }
table.adj { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.adj th, table.adj td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.adj th { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
table.adj td.new { font-weight: 800; color: var(--accent); white-space: nowrap; }
table.adj td.old { white-space: nowrap; color: var(--muted); text-decoration: line-through; }

/* toast & modal */
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: grid; gap: 8px; width: min(440px, calc(100% - 32px)); pointer-events: none; }
body.in-project #toasts, body.in-knit #toasts { bottom: auto; top: calc(70px + env(safe-area-inset-top, 0px)); }
.toast { background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-weight: 600; box-shadow: var(--shadow); animation: tin .2s ease-out; }
.toast.remind { background: var(--remind-soft); color: var(--remind); border: 2px solid var(--remind); }
.toast.err { background: var(--danger); color: #fff; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(20, 14, 24, .55); display: grid; place-items: center; padding: 16px; }
.modal .box { background: var(--surface); border-radius: 18px; padding: 20px; width: min(440px, 100%); display: grid; gap: 14px; box-shadow: var(--shadow); max-height: 90vh; overflow: auto; }
.modal .box.wide { width: min(900px, 100%); }
.modal .box img { border-radius: 10px; }
.modal .btns { display: flex; justify-content: end; gap: 8px; flex-wrap: wrap; }
.notice { padding: 14px 16px; border-radius: 12px; background: var(--remind-soft); color: var(--remind); font-weight: 600; margin-top: 16px; }

/* home */
.hello { text-align: center; display: grid; gap: 4px; justify-items: center; }
.hello .yarnball { width: 56px; height: 56px; }
.hello .sub { font-style: italic; }
.hero { margin: 24px auto 0; max-width: 860px; background: var(--surface); border: 2px solid var(--accent); border-radius: 24px; padding: 24px; display: grid; gap: 20px; box-shadow: var(--shadow); }
.hero-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; }
.ring { width: 132px; height: 132px; position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.9rem; font-variant-numeric: tabular-nums; }
.hero h2 { font-size: clamp(1.5rem, 1.1rem + 1.5vw, 2.2rem); font-weight: 800; overflow-wrap: anywhere; }
.hero .where { color: var(--muted); font-weight: 600; margin: 6px 0 8px; }
.btn-big { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; padding: 10px 20px; border-radius: 18px; border: none; background: var(--accent); color: var(--accent-ink); text-decoration: none; cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 1.3rem; width: 100%; }
.btn-big .t2 { font-family: var(--body); font-weight: 600; font-size: .92rem; opacity: .85; }
.btn-big:hover { filter: brightness(1.06); }
.stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; max-width: 860px; margin: 20px auto 0; }
@media (max-width: 640px) { .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .hero-top { grid-template-columns: 1fr; justify-items: center; text-align: center; } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; text-align: center; }
.stat b { display: block; font-family: var(--display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .84rem; font-weight: 600; }
.home-sec { max-width: 860px; margin: 32px auto 0; }
.home-sec h2 { margin-bottom: 12px; }
.mini-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .mini-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* project overview */
body.in-project main { padding-bottom: 150px; }
.ov-wrap { padding-block: 20px 40px; display: grid; gap: 18px; }
.ov-top { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 760px) { .ov-top { grid-template-columns: minmax(0, 1fr); } }
.ov-pat { padding: 0; overflow: hidden; display: grid; grid-template-rows: 1fr auto; border: 2px solid var(--accent); }
.ov-pat .in { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 18px; text-decoration: none; }
.ov-pat .thumb { border-radius: 8px; border: 1px solid var(--line); }
.ov-pat .thumb .ph { font-size: 1.2rem; }
.ov-pat h3 { font-size: 1.25rem; overflow-wrap: anywhere; }
.ov-pat .by { color: var(--accent); font-weight: 600; margin: 2px 0 0; }
.ov-pat .foot { border-top: 2px solid var(--accent); display: flex; }
.ov-pat .foot button { flex: 1; background: none; border: none; padding: 14px; font-weight: 700; font-size: 1.02rem; cursor: pointer; }
.ov-pat .foot button:hover { background: var(--accent-soft); }
.ov-stats { border: 2px solid var(--accent); display: grid; align-content: center; justify-items: center; text-align: center; gap: 4px; }
.ov-stats .big { font-family: var(--display); font-weight: 800; font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.ov-stats .lbl { color: var(--accent); font-weight: 600; }
.ov-stats .mini { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 10px; font-size: .86rem; color: var(--muted); }
.ov-stats .mini b { color: var(--ink); font-variant-numeric: tabular-nums; }
.guide-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; }
.part { display: grid; gap: 10px; }
.part-h { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 20px; border-radius: 18px; border: 2px solid var(--accent); background: var(--surface); cursor: pointer; text-align: left; }
.part-h.open { background: var(--accent-soft); }
.part-h .tri { color: var(--accent); transition: transform .15s; font-size: .9rem; }
.part-h.open .tri { transform: rotate(90deg); }
.part-h .nm { flex: 1; font-size: 1.3rem; font-weight: 700; font-family: var(--display); min-width: 0; overflow-wrap: anywhere; }
.part-h .pill { font-size: .95rem; padding: 4px 14px; background: var(--accent-soft); color: var(--accent); }
.part-h.open .pill { background: var(--surface); }
.steps { display: grid; gap: 10px; padding-left: 28px; }
@media (max-width: 640px) { .steps { padding-left: 12px; } }
.step { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 16px; align-items: center; width: 100%; padding: 16px 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; }
.step:hover { border-color: var(--muted); }
.step.active { border: 2px solid var(--accent); background: var(--accent-soft); }
.step .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); }
.step.active .dot { background: var(--accent); border-color: var(--accent); }
.step.done .dot { background: var(--ok); border-color: var(--ok); position: relative; }
.step.done .dot::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.step .nm { font-size: 1.1rem; font-weight: 600; display: block; overflow-wrap: anywhere; }
.step.done .nm { color: var(--muted); }
.step .sub2 { color: var(--muted); font-size: .9rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step .st { font-weight: 700; color: var(--accent); font-size: .92rem; white-space: nowrap; }
.step.done .st { color: var(--ok); }
.ov-cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding-block: 12px calc(8px + env(safe-area-inset-bottom, 0px)); }
.ov-cta .wrap { display: grid; gap: 4px; justify-items: center; }
.link-btn { background: none; border: none; font-weight: 700; color: var(--accent); cursor: pointer; padding: 6px 12px; font-size: 1rem; }
.sheet-ins { background: var(--surface-2); border-radius: 12px; padding: 14px; display: grid; gap: 8px; }
.sheet-ins ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; max-height: 240px; overflow: auto; }
.sheet-ins .meta { color: var(--accent); font-weight: 700; font-size: .9rem; }
.modal .box .btn { width: 100%; min-height: 48px; }
.modal .btns .btn { width: auto; }

/* knitting mode */
body.in-knit header.top, body.in-knit .tabbar { display: none; }
body.in-knit main { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.km-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 2px solid var(--accent); }
.km-top-in { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; height: 60px; }
.km-top h1 { text-align: center; font-size: clamp(1.2rem, 1rem + 1.2vw, 1.9rem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.km-top .icon-btn { width: 44px; height: 44px; font-size: 1.5rem; text-decoration: none; border: none; background: transparent; }
.km-status { padding-block: 16px 4px; display: grid; gap: 8px; }
.km-status .bar { height: 12px; }
.km-srow { display: flex; align-items: center; gap: 8px; }
.km-srow .sp { flex: 1; }
.km-srow .pc { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.km-timer { font-variant-numeric: tabular-nums; }
.km-timer.run { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.wake-btn { border-radius: 50%; width: 40px; height: 40px; }
.wake-btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.km-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; padding-block: 10px 24px; align-items: start; }
.km-main.with-pdf { grid-template-columns: minmax(0, 520px) minmax(0, 1fr); }
.km-main.with-pdf .km-left { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); }
.km-main:not(.with-pdf) .km-left { max-width: 860px; margin: 0 auto; width: 100%; }
.km-main:not(.with-pdf) .km-pdf { display: none; }
@media (max-width: 960px) {
  .km-main.with-pdf { grid-template-columns: minmax(0, 1fr); }
  .km-main.with-pdf .km-left { position: static; }
}
.in-knit .vbar { top: calc(62px + env(safe-area-inset-top, 0px)); }
.km-left { display: grid; gap: 14px; justify-items: center; }
.km-chip { display: inline-flex; align-items: center; gap: 10px; padding: 12px 24px; border-radius: 22px; border: none; background: var(--accent-soft); cursor: pointer; max-width: 100%; }
.km-chip b { font-family: var(--display); font-size: 1.5rem; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.km-chip span { color: var(--muted); font-weight: 600; white-space: nowrap; }
.km-pos { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.km-pos .pill { font-size: .9rem; padding: 4px 12px; }
.km-card { width: 100%; background: var(--surface); border: 2px solid var(--accent); border-radius: 22px; padding: clamp(18px, 3vw, 36px); box-shadow: var(--shadow); text-align: center; display: grid; gap: 10px; }
.km-lbl { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.km-ins { font-size: clamp(1.35rem, 1rem + 2vw, 2.4rem); line-height: 1.4; font-weight: 500; overflow-wrap: anywhere; white-space: pre-wrap; }
.km-ins.sm { font-size: clamp(1.1rem, .95rem + 1vw, 1.5rem); }
abbr[data-g] { text-decoration: underline dotted; text-underline-offset: .18em; text-decoration-thickness: 2px; cursor: help; }
.km-left .rem { width: 100%; }
.km-up { color: var(--muted); font-weight: 600; }
.tracker { width: 100%; background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 22px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.tracker .tt { justify-self: start; font-weight: 700; color: var(--accent); font-size: 1.1rem; }
.tracker .big { font-family: var(--display); font-weight: 800; font-size: 4.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tracker .of { color: var(--accent); font-weight: 600; margin-top: -6px; }
.tgrid { display: grid; grid-template-columns: repeat(3, 64px); gap: 10px; }
.tgrid button { width: 64px; height: 64px; border-radius: 50%; border: none; font-weight: 800; font-size: 1.2rem; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.tgrid button.neg { background: var(--surface-2); color: var(--muted); }
.km-bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 2px solid var(--accent); padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px)); }
.km-bot-in { display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; gap: 14px; align-items: center; max-width: 1000px; }
.km-circ { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); font-size: 1.7rem; font-weight: 700; cursor: pointer; display: grid; place-items: center; }
.km-circ.minus { border-color: var(--line); color: var(--muted); }
.km-next { min-height: 64px; border-radius: 18px; border: none; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-weight: 800; font-size: clamp(1.15rem, 1rem + 1vw, 1.6rem); cursor: pointer; padding: 0 12px; }
.km-next:active, .km-circ:active, .tgrid button:active { transform: scale(.97); }

.picker { display: grid; gap: 14px; }

/* v4: knitting screen counters, part menus, status */

/* pieces you can switch between */

.ch-rl { display: flex; flex-direction: column; }
.ch-rl span { flex: 1; display: flex; align-items: center; justify-content: center; font-size: clamp(8px, 1.4vw, 12px); color: var(--accent); font-weight: 600; min-height: 0; overflow: hidden; }

.seg { display: flex; gap: 10px; flex-wrap: wrap; }
.seg button { min-height: 44px; min-width: 76px; padding: 8px 20px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; color: var(--ink); }

.cx-edh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.cx-selbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-radius: 12px; background: var(--surface-2); }

/* line up your chart */
.tr { position: fixed; inset: 0; z-index: 45; background: var(--bg); display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }

/* steps builder */

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
const int = v => { const n = parseInt(v, 10); return Number.isFinite(n) && n > 0 ? n : null; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('pp:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('pp:' + k, JSON.stringify(v)); } catch {} }
};
const CATS = ['Sweaters', 'Cardigans', 'Tops & Tees', 'Hats', 'Socks', 'Shawls', 'Scarves & Cowls', 'Mittens & Gloves', 'Blankets', 'Baby & Kids', 'Toys', 'Home', 'Bags', 'Other'];
const LEVELS = ['Beginner', 'Easy', 'Intermediate', 'Experienced'];
const ICON_FLAG = '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M4 2a1 1 0 0 1 1 1v.3c2.6-1.2 4.6.6 7 0 1.3-.3 2.2-.7 3-1.1V12c-.8.4-1.7.8-3 1.1-2.4.6-4.4-1.2-7 0V18H3V3a1 1 0 0 1 1-1z"/></svg>';
const ICON_HEART = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4.7-1.3 2.2-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>';
const initials = t => (String(t || '?').match(/\b\w/g) || ['?']).slice(0, 2).join('').toUpperCase();
const blobUrl = id => './_blob/' + id;
const ago = t => {
  if (!t) return '';
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  const d = Math.floor(s / 86400);
  return d === 1 ? 'yesterday' : d + ' days ago';
};

function toast(msg, kind = '', ms = 3200) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = msg;
  $('#toasts').append(el);
  setTimeout(() => el.remove(), ms);
}
function modal(html, { wide = false } = {}) {
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="box ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.append(m);
  const close = () => m.remove();
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', function k(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', k); } });
  return { el: m, close };
}
function confirmBox(title, body, okLabel = 'Delete') {
  return new Promise(res => {
    const m = modal(`<h2>${esc(title)}</h2><p class="muted" style="margin:0">${esc(body)}</p>
      <div class="btns"><button class="btn" data-close>Cancel</button><button class="btn primary" id="cfOk">${esc(okLabel)}</button></div>`);
    $('#cfOk', m.el).onclick = () => { m.close(); res(true); };
    m.el.addEventListener('click', e => { if (e.target === m.el || e.target.closest('[data-close]')) res(false); });
  });
}

/* ---------- state & storage ---------- */
const S = {
  db: null, assets: null, sample: null, noDb: false,
  patterns: new Map(), projects: new Map(),
  loaded: { patterns: false, projects: false },
  uploads: [],
  lib: store.get('lib', { q: '', cat: 'all', sort: 'recent' }),
  zoom: store.get('zoom', 1),
};
const writers = new Map();
function withPending(path, data) {
  const w = writers.get(path);
  return w ? { ...data, ...(w.inflight || {}), ...(w.pending || {}) } : data;
}
function applyLocal(path, patch) {
  const [col, id] = path.split('/');
  const m = col === 'patterns' ? S.patterns : col === 'projects' ? S.projects : null;
  if (m && m.has(id)) m.set(id, { ...m.get(id), ...patch });
}
function saveErr(e) {
  if (e?.code === 'quota_exceeded') return 'Storage is full. Delete some patterns or photos, then try again.';
  if (e?.code === 'invalid_argument') return 'You can view this page but not change it.';
  return 'Couldn’t save that change. Check your connection and try again.';
}
/* one write at a time per document; rapid edits coalesce into the next write */
function save(path, patch) {
  if (!S.db) return;
  applyLocal(path, patch);
  let w = writers.get(path);
  if (!w) { w = { pending: null, inflight: null }; writers.set(path, w); }
  w.pending = Object.assign(w.pending || {}, patch);
  if (!w.inflight) flush(path, w);
}
async function flush(path, w) {
  while (w.pending) {
    w.inflight = w.pending; w.pending = null;
    try { await S.db.doc(path).update(w.inflight); }
    catch (e) { toast(esc(saveErr(e)), 'err'); }
  }
  w.inflight = null;
}

/* ---------- pdf.js (loaded on first use) ---------- */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsP = null;
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load')); document.head.append(s); });
function loadPdfJs() {
  return pdfjsP ||= (async () => {
    await loadScript(PDFJS + 'pdf.min.js');
    await loadScript(PDFJS + 'pdf.worker.min.js'); // runs the parser on the page; the sandbox blocks cross-site workers
    const lib = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
    lib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
    return lib;
  })().catch(e => { pdfjsP = null; throw e; });
}
const pdfCache = new Map();
function openPdfData(data) { return loadPdfJs().then(lib => lib.getDocument({ data, isEvalSupported: false }).promise); }
function openPdfAsset(id) {
  if (!pdfCache.has(id)) {
    const p = fetch(blobUrl(id)).then(r => { if (!r.ok) throw new Error('fetch'); return r.arrayBuffer(); }).then(b => openPdfData(new Uint8Array(b)));
    p.catch(() => pdfCache.delete(id));
    pdfCache.set(id, p);
  }
  return pdfCache.get(id);
}
async function renderPageBlob(pdf, n, width, quality = .82) {
  const page = await pdf.getPage(n);
  const vp1 = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: width / vp1.width });
  const c = document.createElement('canvas');
  c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return new Promise(r => c.toBlob(r, 'image/jpeg', quality));
}
async function extractText(pdf, cap = 80000) {
  let out = '';
  for (let i = 1; i <= pdf.numPages && out.length < cap; i++) {
    const tc = await (await pdf.getPage(i)).getTextContent();
    out += `\n--- Page ${i} ---\n` + tc.items.map(it => it.str + (it.hasEOL ? '\n' : ' ')).join('');
  }
  return out.slice(0, cap);
}

/* ---------- import PDFs ---------- */
function titleFromFile(name) {
  return name.replace(/\.pdf$/i, '').replace(/[_\-]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/\b\w/g, c => c.toUpperCase()) || 'Untitled pattern';
}
async function importFiles(files) {
  const pdfs = [...files].filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name));
  if (!pdfs.length) { toast('Choose PDF files to add patterns.'); return; }
  if (!S.db) { toast('Open this page on claude.ai while signed in to save patterns.', 'err'); return; }
  if (!S.assets) { toast('Only people who can edit this page can add patterns.', 'err'); return; }
  for (const f of pdfs) S.uploads.push({ key: rid(), file: f, name: f.name, status: 'Waiting…' });
  renderUploads();
  for (const u of S.uploads.filter(u => u.status === 'Waiting…')) await importOne(u);
  setTimeout(() => { S.uploads = S.uploads.filter(u => u.err); renderUploads(); }, 2500);
}
async function importOne(u) {
  const set = (s, err) => { u.status = s; u.err = !!err; renderUploads(); };
  const f = u.file;
  if (f.size > 20 * 1024 * 1024) return set('Too large: PDFs must be 20 MB or smaller', true);
  try {
    set('Reading…');
    const pdf = await openPdfData(new Uint8Array(await f.arrayBuffer()));
    const thumbBlob = await renderPageBlob(pdf, 1, 420).catch(() => null);
    const text = await extractText(pdf).catch(() => '');
    set('Uploading…');
    const up = await S.assets.upload(f, { type: 'application/pdf' });
    pdfCache.set(up.id, Promise.resolve(pdf));
    let thumb = null;
    if (thumbBlob) thumb = (await S.assets.upload(thumbBlob, { type: 'image/jpeg' }).catch(() => null))?.id || null;
    const id = rid(), now = Date.now();
    await S.db.doc('patterns/' + id).set({
      title: titleFromFile(f.name), titleAuto: true, sizes: '', notions: '', designer: '', category: '', difficulty: '', tags: [], favorite: false,
      pdf: up.id, pdfName: f.name, pages: pdf.numPages, thumb, link: '', yarn: '', needles: '',
      gauge: { sts: null, rows: null }, notes: '', createdAt: now, updatedAt: now
    });
    if (text.trim()) await S.db.doc('patternText/' + id).set({ text }).catch(() => {});
    if (S.sample) {
      set('Reading pattern details…');
      const filled = await autofillDetails({ id, pdf: up.id, text, titleAuto: true, pdfName: f.name }).catch(() => null);
      return set(filled ? 'Added · details filled in' : 'Added · fill in details by hand');
    }
    set('Added');
  } catch (e) {
    const msg = e?.code === 'quota_exceeded' ? 'Storage is full' : e?.code === 'payload_too_large' ? 'File too large' : e?.message === 'load' ? 'Couldn’t load the PDF reader' : 'Couldn’t read this PDF';
    set(msg, true);
  }
}
function renderUploads() {
  const box = $('#uploads');
  if (!box) return;
  box.className = 'uploads';
  box.innerHTML = S.uploads.map(u => `<div class="upl ${u.err ? 'err' : ''}"><span class="n">${esc(u.name)}</span><span class="s">${esc(u.status)}</span>${u.err ? `<button class="btn small ghost" data-dismiss="${u.key}">Dismiss</button>` : ''}</div>`).join('');
}
document.addEventListener('click', e => {
  const d = e.target.closest('[data-dismiss]');
  if (d) { S.uploads = S.uploads.filter(u => u.key !== d.dataset.dismiss); renderUploads(); }
});
$('#pdfInput').addEventListener('change', e => { importFiles(e.target.files); e.target.value = ''; });

/* ---------- step model ----------
   A project's `sections` is the ordered list of steps. Steps sharing a `part` name in a row are grouped (Back, Left Front…).
   kind "rows": counted row by row (rows per repeat × repeats, optional row-by-row text and reminders)
   kind "stitches": a stitch tracker with a target (cast on, pick up)
   kind "task": one instruction you mark done */
const kindOf = s => s.kind || 'rows';
const secTotal = s => (kindOf(s) === 'rows' && s.rows ? s.rows * (s.repeats || 1) : null);
const cnt = (p, s) => (p.counts || {})[s.id] || 0;
function stepDone(p, s) {
  if ((p.done || {})[s.id]) return true;
  if (kindOf(s) !== 'rows') return false;
  const t = secTotal(s);

      <div class="meta"><h3>${esc(p.title)}</h3>${p.designer ? `<p class="by">${esc(p.designer)}</p>` : ''}
        <div class="tags">${p.example ? '<span class="pill ex">Example</span>' : ''}${activeBy.has(p.id) ? '<span class="pill live">On the needles</span>' : ''}${p.category ? `<span class="pill">${esc(p.category)}</span>` : ''}${p.difficulty ? `<span class="pill">${esc(p.difficulty)}</span>` : ''}</div></div>
      <button class="fav" data-fav="${esc(p.id)}" aria-pressed="${!!p.favorite}" aria-label="Favorite">${ICON_HEART}</button>
      <button class="card-more" data-pmore="${esc(p.id)}" aria-label="More options for ${esc(p.title)}">•••</button>
    </article>`).join('') || (S.loaded.patterns ? `<p class="muted">No patterns match. Try another search or filter.</p>` : '');
  }
  draw();
  return { update: draw };
}

/* ---------- backup & move between devices ----------
   One JSON file holds every pattern, project and pattern text, plus the files they point at (PDFs, covers, photos, charts).
   The online app and the offline app read and write the same file. On restore, newer copies replace older ones. */
const BACKUP_COLS = ['patterns', 'projects', 'patternText'];
const blobIdsIn = (obj, known) => { const s = JSON.stringify(obj); return [...new Set(s.match(/[0-9a-f]{32}/g) || [])].filter(x => known ? known.has(x) : true); };
const toB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
const fromB64 = (b64, type) => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type }); };
async function exportBackup(btn) {
  if (!S.db) return toast('Your patterns aren’t loaded yet.', 'err');
  const label = btn?.textContent; if (btn) { btn.disabled = true; btn.textContent = 'Packing your patterns…'; }
  try {
    const docs = {};
    for (const col of BACKUP_COLS) {
      const snap = await S.db.collection(col).get();
      docs[col] = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
    }
    const blobs = {};
    for (const bid of blobIdsIn(docs)) {
      try { const r = await fetch(blobUrl(bid)); if (!r.ok) continue; const b = await r.blob(); blobs[bid] = { type: b.type || 'application/octet-stream', b64: await toB64(b) }; } catch {}
    }
    const out = { app: 'purl-and-page', version: 1, exportedAt: Date.now(), docs, blobs };
    const name = `purl-and-page-backup-${new Date().toISOString().slice(0, 10)}.json`;
    const file = new Blob([JSON.stringify(out)], { type: 'application/json' });
    if (!S.downloads) throw { code: 'unavailable' };
    await S.downloads.save({ filename: name, data: file });
    toast(`Backup saved: ${Object.keys(docs.patterns).length} patterns, ${Object.keys(docs.projects).length} projects.`, '', 4000);
  } catch (e) {
    toast(e?.code === 'unavailable' ? 'Saving files isn’t available in this view.' : e?.code === 'declined' ? 'Backup not saved.' : e?.code === 'too_large' ? 'The backup is too large to save in one file.' : 'Couldn’t make the backup. Try again.', 'err', 4000);
  } finally { if (btn) { btn.disabled = false; btn.textContent = label; } }
}
function pickBackup() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => { const f = inp.files[0]; if (f) importBackup(f); };
  inp.click();
}
async function importBackup(file) {
  if (!S.db) return toast('Your patterns aren’t loaded yet.', 'err');
  let data;
  try { data = JSON.parse(await file.text()); } catch { return toast('That file isn’t a Purl & Page backup.', 'err'); }
  if (data?.app !== 'purl-and-page' || !data.docs) return toast('That file isn’t a Purl & Page backup.', 'err');
  const mine = { patterns: S.patterns, projects: S.projects };
  const plan = [];
  for (const col of BACKUP_COLS) for (const [did, d] of Object.entries(data.docs[col] || {})) {
    const cur = mine[col]?.get(did);
    if (col === 'patternText' || !cur || (d.updatedAt || 0) > (cur.updatedAt || 0)) plan.push([col, did, d]);
  }
  const np = plan.filter(x => x[0] === 'patterns').length, nj = plan.filter(x => x[0] === 'projects').length;
  if (!np && !nj) return toast('Everything in that backup is already here and up to date.');
  if (!(await confirmBox('Restore this backup?', `${np} pattern${np === 1 ? '' : 's'} and ${nj} project${nj === 1 ? '' : 's'} will be added or updated. Where both have a copy, the newer one is kept. Nothing else is deleted.`, 'Restore'))) return;
  toast('Restoring… keep this page open.', '', 2500);
  try {
    const known = new Set(Object.keys(data.blobs || {}));
    const need = blobIdsIn(plan.map(x => x[2]), known), map = {};
    for (const bid of need) {
      const b = data.blobs[bid];
      const up = await S.assets.upload(fromB64(b.b64, b.type), { type: b.type });
      map[bid] = up.id;
    }
    for (const [col, did, d] of plan) {
      let json = JSON.stringify(d);
      for (const [a, z] of Object.entries(map)) if (a !== z) json = json.split(a).join(z);
      await S.db.doc(col + '/' + did).set(JSON.parse(json));
    }
    toast(`Restored ${np} pattern${np === 1 ? '' : 's'} and ${nj} project${nj === 1 ? '' : 's'}.`, '', 4000);
  } catch (e) { toast(e?.code === 'quota_exceeded' ? 'Storage is full.' : 'Couldn’t finish restoring. Try again.', 'err', 4000); }
}

/* ---------- home ---------- */
function ringSvg(pct, size = 132) {
  const r = 52, C = 2 * Math.PI * r;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--accent-soft)" stroke-width="12"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - Math.min(100, pct) / 100)}"/></svg><span class="pct">${Math.floor(pct)}%</span></div>`;
}
function projStatusLabel(p) {
  const c = cState(p);
  if (p.status === 'finished') return ['Finished', 'ok'];
  if (p.status === 'paused') return ['Paused', ''];
  if (p.status === 'off') return ['Off the needles', ''];
  if (p.status === 'planned') return ['Not started', ''];
  if (c.allDone) return ['Every step done', 'ok'];
  if (!c.knit && !elapsed(p) && !Object.values(p.counts || {}).some(Boolean)) return ['Ready to start', ''];
  return ['In progress', 'live'];
}

    $('#hi', el).textContent = S.userName ? `${greet}, ${S.userName.split(' ')[0]}!` : `${greet}!`;
    const projs = [...S.projects.values()].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

    else if (!active.length) {
      hero.innerHTML = `<div class="hero" style="text-align:center"><h2>Nothing on the needles</h2><p class="muted" style="margin:0">Pick a pattern from your library and start a project. Steps, row counts and reminders come from the pattern.</p>
        <a class="btn-big" href="#library">Browse patterns</a></div>`;
    } else {

      hero.innerHTML = `<div class="hero"><div class="hero-top">${ringSvg(c.pct)}<div style="min-width:0"><h2>${esc(p.name)}</h2>

      : `<div class="empty" style="margin-top:0"><p>Add your PDF patterns and Claude fills in the details.</p><button class="btn primary" id="hAdd">＋ Add PDF patterns</button></div>`) : '';
  }
  draw();
  return { update: draw };
}

function mountProjects(el, tab = 'current') {
  el.innerHTML = `<section class="wrap page"><div class="lib-head"><div><h1>Projects</h1><p class="sub" id="pjSub"></p></div><a class="btn" href="#library">Start from a pattern</a></div>${noDbNotice()}

  function draw() {
    const all = [...S.projects.values()].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    const fin = all.filter(p => p.status === 'finished').sort((a, b) => (b.finished || '').localeCompare(a.finished || '') || (b.updatedAt || 0) - (a.updatedAt || 0));
    const cur = all.filter(p => p.status !== 'finished');
    $('#pjCur', el).innerHTML = `In progress <span>${cur.length}</span>`; $('#pjCur', el).setAttribute('aria-selected', tab === 'current');

    $('#pjSub', el).textContent = tab === 'finished' ? 'Everything you’ve cast off. Nice work.' : 'Everything on your needles, with where you left off.';
    const box = $('#plist', el);
    if (!S.loaded.projects) { box.innerHTML = S.noDb ? '' : '<p class="muted" style="margin-top:20px">Loading…</p>'; return; }
    if (tab === 'finished') {
      box.innerHTML = fin.length ? `<div class="fin-grid">${fin.map(finCard).join('')}</div>`
        : `<div class="empty"><h2>Nothing finished yet</h2><p>When you finish a project, mark it finished from its project page or the knitting screen and it moves here, with its photos, dates and time knit.</p></div>`;
      return;
    }
    if (!cur.length) {
      box.innerHTML = `<div class="empty"><h2>${fin.length ? 'Nothing on the needles' : 'No projects yet'}</h2><p>Open a pattern from your library and choose “Start project” to get a row counter that follows the pattern’s sections.</p><a class="btn primary" href="#library">Go to patterns</a></div>`;

    }

}
function finCard(p) {
  const pat = S.patterns.get(p.patternId);

  const when = p.finished ? new Date(p.finished + 'T12:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';

      <span class="fin-stats">${t ? `<b>${fmtDur(t, true)}</b> knit` : ''}${c.knit ? `${t ? ' · ' : ''}<b>${c.knit}</b> rows` : ''}${p.yarn?.name ? ` · ${esc(p.yarn.name)}` : ''}</span></div></a>`;

/* finishing keeps everything; it just moves the project to the Finished section */

/* deleting a pattern also deletes every project made from it, with their photos and charts */
async function deletePattern(id) {

  if (!S.db) return toast('Sign in on claude.ai to change your library.', 'err');
  const projs = [...S.projects.values()].filter(x => x.patternId === id);

  if (!(await confirmBox('Delete this pattern?', `“${p.title}” and its PDF will be removed for good.${n ? ` Its ${n} project${n > 1 ? 's' : ''} (${projs.map(x => x.name).join(', ')}) will be deleted too, with their row counts, notes, photos and charts.` : ''}`, n ? 'Delete pattern and projects' : 'Delete'))) return;
  try {
    await S.db.doc('patterns/' + id).delete();

    const gone = [p.pdf, p.thumb];
    for (const x of projs) {
      await S.db.doc('projects/' + x.id).delete();

      (x.photos || []).forEach(ph => gone.push(ph.id));
      (x.charts || []).forEach(ch => gone.push(ch.img));

    toast(n ? `Pattern and ${n} project${n > 1 ? 's' : ''} deleted` : 'Pattern deleted');

}

/* ---------- PDF viewer with row marker & highlighter ---------- */
function createViewer(host, { pattern, marks, onMarks }) {
  const markable = !!onMarks;
  let mode = 'scroll';
  let curMarks = marks || { marker: null, hl: [] };
  let pdf = null, sizes = [], pages = [], io = null, dead = false;
  const zoomSteps = [0.6, 0.75, 0.9, 1, 1.15, 1.35, 1.6, 2];
  host.innerHTML = `<div class="vbar">
      <div class="vgroup" role="group" aria-label="Zoom"><button class="icon-btn" data-z="-1" aria-label="Zoom out">−</button><button class="icon-btn" data-z="0" id="zl">100%</button><button class="icon-btn" data-z="1" aria-label="Zoom in">+</button></div>
      <select id="pgSel" aria-label="Go to page"></select>
      ${markable ? `<span class="sp"></span>
      <div class="vgroup" role="group" aria-label="Pen">
        <button class="icon-btn on" data-mode="scroll" title="Scroll the pattern">Scroll</button>
        <button class="icon-btn" data-mode="marker" title="Tap a line to place the row marker">Marker</button>
        <button class="icon-btn" data-mode="highlight" title="Drag to highlight">Highlight</button>
        <button class="icon-btn" data-mode="erase" title="Tap a highlight to remove it">Erase</button>
      </div>
      <div class="vgroup" role="group" aria-label="Move marker" id="mkMove"><button class="icon-btn" data-mv="-1" aria-label="Marker up one line">▲</button><button class="icon-btn" data-mv="1" aria-label="Marker down one line">▼</button><button class="icon-btn" data-mv="size" title="Change marker height">↕</button></div>` : ''}
    </div><div class="pages" id="pages"></div>`;
  const pagesEl = $('#pages', host);
  const zl = $('#zl', host), pgSel = $('#pgSel', host);
  const setZoomLabel = () => { zl.textContent = Math.round(S.zoom * 100) + '%'; };
  setZoomLabel();

  if (!pattern.pdf) {
    $('.vbar', host).hidden = !markable;
    $$('[data-z], #pgSel', host).forEach(b => b.hidden = true);
    pagesEl.innerHTML = pattern.text ? `<div class="pg" data-p="1" style="background:none;box-shadow:none;width:100%;max-width:760px"><pre class="ptext">${esc(pattern.text)}</pre><div class="ov"></div></div>` : `<p class="vmsg">This pattern has no PDF attached.</p>`;
    pages = pattern.text ? [{ el: $('.pg', pagesEl), ov: $('.ov', pagesEl), n: 1 }] : [];
    wireOverlays(); drawMarks();
  } else {
    pagesEl.innerHTML = `<p class="vmsg">Opening the pattern…</p>`;
    openPdfAsset(pattern.pdf).then(async doc => {
      if (dead) return;
      pdf = doc;
      sizes = await Promise.all(Array.from({ length: doc.numPages }, (_, i) => doc.getPage(i + 1).then(pg => { const v = pg.getViewport({ scale: 1 }); return { w: v.width, h: v.height }; })));
      if (dead) return;
      pagesEl.innerHTML = '';
      pages = sizes.map((_, i) => {
        const d = document.createElement('div');
        d.className = 'pg'; d.dataset.p = i + 1;
        d.innerHTML = `<canvas></canvas><div class="ov"></div>`;
        pagesEl.append(d);
        return { el: d, ov: $('.ov', d), canvas: $('canvas', d), n: i + 1, rendered: 0, task: null };
      });
      pgSel.innerHTML = pages.map(p => `<option value="${p.n}">Page ${p.n} of ${pages.length}</option>`).join('');
      layout();
      io = new IntersectionObserver(ents => ents.forEach(en => { if (en.isIntersecting) renderPage(pages[+en.target.dataset.p - 1]); }), { rootMargin: '900px 0px' });
      pages.forEach(p => io.observe(p.el));
      wireOverlays(); drawMarks();
      if (pendingGo) { const g = pendingGo; pendingGo = null; goTo(g.page, g.y); }
    }).catch(() => { if (!dead) pagesEl.innerHTML = `<p class="vmsg">Couldn’t open this PDF. Check your connection, then reload the page.</p>`; });
  }
  function baseWidth() { return Math.min(pagesEl.clientWidth || host.clientWidth || 600, 900); }
  function layout() {
    const W = baseWidth() * S.zoom;
    pages.forEach((p, i) => {
      if (!p.canvas) return;
      const sz = sizes[i];
      p.el.style.width = W + 'px';
      p.el.style.height = (W * sz.h / sz.w) + 'px';
      p.rendered = 0;
    });
  }
  async function renderPage(p) {
    if (!pdf || !p.canvas) return;
    const W = baseWidth() * S.zoom;
    if (p.rendered === W) return;
    p.rendered = W;
    try {
      if (p.task) p.task.cancel();
      const page = await pdf.getPage(p.n);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const vp = page.getViewport({ scale: (W / sizes[p.n - 1].w) * dpr });
      const c = document.createElement('canvas');
      c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      p.task = page.render({ canvasContext: c.getContext('2d'), viewport: vp });
      await p.task.promise;
      p.task = null;
      if (p.rendered !== W) return;
      p.canvas.replaceWith(c); p.canvas = c;
    } catch (e) { if (e?.name !== 'RenderingCancelledException') p.rendered = 0; }
  }
  function rerenderAll() {
    layout();
    if (!io) return;
    pages.forEach(p => { io.unobserve(p.el); io.observe(p.el); });
  }
  let rT;
  const onResize = () => { clearTimeout(rT); rT = setTimeout(rerenderAll, 200); };
  window.addEventListener('resize', onResize);
  host.addEventListener('click', e => {
    const z = e.target.closest('[data-z]');
    if (z) {
      const d = +z.dataset.z;
      let i = zoomSteps.findIndex(s => s >= S.zoom - 0.001);
      if (i < 0) i = 3;
      S.zoom = d === 0 ? 1 : zoomSteps[Math.max(0, Math.min(zoomSteps.length - 1, i + d))];
      store.set('zoom', S.zoom); setZoomLabel(); rerenderAll();
    }
    const m = e.target.closest('[data-mode]');
    if (m) setMode(m.dataset.mode);
    const mv = e.target.closest('[data-mv]');
    if (mv) moveMarker(mv.dataset.mv);
  });
  pgSel.addEventListener('change', () => goTo(+pgSel.value));
  const onScroll = () => {
    if (!pages.length || !pgSel.options.length) return;
    const line = innerHeight * 0.35;
    const p = pages.find(p => { const r = p.el.getBoundingClientRect(); return r.bottom > line; });
    if (p && pgSel.value != p.n) pgSel.value = p.n;
  };
  window.addEventListener('scroll', onScroll, { passive: true });

  function setMode(m) {
    mode = m;
    host.classList.remove('mode-marker', 'mode-highlight', 'mode-erase');
    if (m !== 'scroll') host.classList.add('mode-' + m);
    $$('[data-mode]', host).forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  }
  function commit(next) { curMarks = next; drawMarks(); onMarks && onMarks(next); }
  function moveMarker(how) {
    const mk = curMarks.marker;
    if (!mk) { toast('Choose Marker, then tap the line you’re on.'); return; }
    if (how === 'size') {
      const steps = [0.018, 0.026, 0.036, 0.05];
      const h = steps[(steps.findIndex(s => s >= mk.h - 0.0005) + 1) % steps.length];
      return commit({ ...curMarks, marker: { ...mk, h } });
    }
    let y = mk.y + (+how) * mk.h, page = mk.page;
    if (y + mk.h > 1 && page < pages.length) { page++; y = 0.04; }
    if (y < 0 && page > 1) { page--; y = 0.92; }
    y = Math.max(0, Math.min(1 - mk.h, y));
    commit({ ...curMarks, marker: { ...mk, page, y } });
    revealMarker();
  }
  function revealMarker() {
    const mk = curMarks.marker; const p = mk && pages[mk.page - 1];
    if (!p) return;
    const el = $('.mk', p.ov); if (!el) return;
    const r = el.getBoundingClientRect();
    if (r.top < 120 || r.bottom > innerHeight * 0.6) window.scrollBy({ top: r.top - innerHeight * 0.3, behavior: 'smooth' });
  }
  function wireOverlays() {
    if (!markable) return;
    pages.forEach(p => {
      let start = null, draft = null;
      const pt = e => { const r = p.ov.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; };
      p.ov.addEventListener('pointerdown', e => {
        if (mode === 'highlight') {
          start = pt(e); p.ov.setPointerCapture(e.pointerId);
          draft = document.createElement('div'); draft.className = 'hl'; p.ov.append(draft);
        }
      });
      p.ov.addEventListener('pointermove', e => {
        if (!start || !draft) return;
        const c = pt(e);
        const x = Math.min(start.x, c.x), y = Math.min(start.y, c.y), w = Math.abs(c.x - start.x), h = Math.max(Math.abs(c.y - start.y), 0.012);
        Object.assign(draft.style, { left: x * 100 + '%', top: y * 100 + '%', width: w * 100 + '%', height: h * 100 + '%' });
        draft._r = { x, y, w, h };
      });
      p.ov.addEventListener('pointerup', e => {
        if (mode === 'marker') {
          const c = pt(e), h = curMarks.marker?.h || 0.026;
          commit({ ...curMarks, marker: { page: p.n, y: Math.max(0, Math.min(1 - h, c.y - h / 2)), h } });
          return;
        }
        if (mode === 'highlight' && draft) {
          const r = draft._r; draft.remove(); draft = null; start = null;
          if (r && r.w > 0.01) commit({ ...curMarks, hl: [...(curMarks.hl || []), { page: p.n, ...r }] });
          return;
        }
        if (mode === 'erase') {
          const el = e.target.closest('.hl');
          if (el && el.dataset.i != null) commit({ ...curMarks, hl: curMarks.hl.filter((_, i) => i !== +el.dataset.i) });
        }
      });
    });
  }
  function drawMarks() {
    pages.forEach(p => {
      if (!p.ov) return;
      const hl = (curMarks.hl || []).map((h, i) => h.page === p.n ? `<div class="hl" data-i="${i}" style="left:${h.x * 100}%;top:${h.y * 100}%;width:${h.w * 100}%;height:${h.h * 100}%"></div>` : '').join('');
      const mk = curMarks.marker && curMarks.marker.page === p.n ? `<div class="mk" style="top:${curMarks.marker.y * 100}%;height:${curMarks.marker.h * 100}%"></div>` : '';
      p.ov.innerHTML = hl + mk;
    });
  }
  let pendingGo = null;
  function goTo(page, y = 0) {
    const p = pages[page - 1];
    if (!p) { pendingGo = { page, y }; return; }
    const r = p.el.getBoundingClientRect();
    window.scrollTo({ top: scrollY + r.top + r.height * y - 120, behavior: 'smooth' });
  }
  return {
    setMarks(m) { curMarks = m || { marker: null, hl: [] }; drawMarks(); },
    goTo, revealMarker,
    destroy() { dead = true; io?.disconnect(); window.removeEventListener('resize', onResize); window.removeEventListener('scroll', onScroll); }
  };
}

    const pe = $('#kmPieces', el);
    pe.hidden = parts.length < 2;
    pe.innerHTML = parts.map(g => { const on = g.steps.includes(c.s); const pc = Math.floor(pctOf(p, g.steps)); return `<button role="tab" aria-selected="${on}" data-piece="${esc(g.steps[0].id)}" class="${pc >= 100 ? 'fin' : ''}"><span>${esc(g.name)}</span><small>${pc >= 100 ? '✓' : pc + '%'}</small></button>`; }).join('');
    const onB = pe.querySelector('[aria-selected="true"]');
    if (onB && pe.dataset.cur !== onB.dataset.piece) { pe.dataset.cur = onB.dataset.piece; onB.scrollIntoView({ block: 'nearest', inline: 'center' }); }
    $('#kmBar', el).style.width = c.pct + '%';
    $('#kmBar', el).parentElement.classList.toggle('done', c.allDone);
    $('#kmPct', el).textContent = Math.floor(c.pct) + '%';
    const run = !!p.timerStart, tb = $('#kmTimer', el);
    tb.classList.toggle('run', run);
    tb.innerHTML = `${run ? '❚❚ Pause' : '▶ Start'} · ${fmtDur(elapsed(p))}`;
    $('#kmWake', el).classList.toggle('on', wakeOn);
    $('#kmTap', el).textContent = tapText(p);
    const next = $('#kmNext', el);
    next.disabled = c.allDone; $('#kmPlus', el).disabled = c.allDone;
    next.textContent = c.idx < 0 || c.kind === 'rows' ? '▶ Next row' : c.allDone ? 'All done' : '✓ Step done';
    if (p.cur !== lastSec) { lastSec = p.cur; if (viewer && c.s?.page && !p.marks?.marker) viewer.goTo(c.s.page); }
    if (viewer) viewer.setMarks(p.marks);
    if (c.idx < 0) {
      left.innerHTML = `<div class="kc-grid one"><div class="kc kc-row"><span class="kc-lbl">Row</span><span class="kc-num">${(p.counts && Object.values(p.counts)[0]) || 0}</span></div></div>
        <div class="km-card"><div class="km-ins sm">This project has no steps yet. + and Next row count rows, or set up steps from the pattern.</div><button class="btn" id="kmSetup" style="justify-self:center">Set up steps</button></div>`;
      return;
    }
    if (c.allDone) {
      left.innerHTML = `<div class="km-card"><div class="km-lbl">Pattern complete</div><div class="km-ins">Every step is done.</div><p class="muted" style="margin:0">${c.knit} rows · ${fmtDur(elapsed(p), true)} of knitting</p>
        ${p.status !== 'finished' ? '<button class="btn primary" id="kmDoneProj" style="justify-self:center">Mark project finished</button>' : ''}</div>`;
      return;
    }
    const s = c.s, rt = s.rowText || [];
    const nowR = remindersAt(s, c.r), nxt = nextReminder(s, c.r);
    let counters = '', ins;
    if (c.kind === 'rows') {
      if (c.rep) {
        counters = `<div class="kc-grid"><div class="kc kc-row"><span class="kc-lbl">☰ Row ${sideTag(c.side)}</span><span class="kc-num">${c.r}<small>/${c.tot}</small></span><span class="kc-sub">Row ${c.rep.row} of ${c.rep.per} in this repeat</span></div>
          <div class="kc kc-rep"><span class="kc-lbl">⟳ ${esc(s.repeatName || 'Repeat')}</span><span class="kc-num">${c.rep.at}<small>/${c.rep.of}</small></span></div></div>`;
      } else {
        counters = `<div class="kc-grid one"><div class="kc kc-row"><span class="kc-lbl">Row ${sideTag(c.side)}</span><span class="kc-num">${c.r}${c.tot ? `<small>/${c.tot}</small>` : ''}</span>${!c.tot ? '<span class="kc-sub">until the piece measures right</span>' : ''}</div></div>`;
